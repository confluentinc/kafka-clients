language = "C"
# Use "Type" style so function signatures use the typedef name
# (e.g. kafka_producer_ProducerRecord_t *) without the "struct" keyword.
style = "Type"
include_guard = "CONFLUENT_KAFKA_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]

[export]
# Only export FFI types — no internal Kafka client constants or structs.
include = ["kafka_producer_Producer_t", "kafka_producer_FutureRecordMetadata_t", "kafka_producer_RecordMetadata_t", "kafka_producer_ProducerRecord_t", "kafka_common_KafkaError_t", "kafka_consumer_ShareConsumer_t", "kafka_consumer_ShareConsumerProperties_t", "kafka_consumer_StringList_t", "kafka_consumer_ShareConsumer_op_callback_t", "kafka_consumer_ConsumerRecords_t", "kafka_consumer_ConsumerRecord_t", "kafka_consumer_ShareConsumer_poll_callback_t"]
item_types = ["functions", "structs", "typedefs"]

[fn]
prefix = ""
args = "Vertical"

[enum]
prefix_with_name = true
