language = "C"
# Use "Type" style so function signatures use the typedef name
# (e.g. kafka_producer_ProducerRecord_t *) without the "struct" keyword.
style = "Type"
include_guard = "CONFLUENT_KAFKA_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]

[export]
# Only export FFI types — no internal Kafka client constants or structs.
include = ["kafka_producer_Producer_t", "kafka_producer_FutureRecordMetadata_t", "kafka_producer_RecordMetadata_t", "kafka_producer_ProducerRecord_t", "kafka_common_KafkaError_t", "kafka_producer_Producer_send_callback_t", "kafka_producer_Producer_send_batch_callback_t", "kafka_producer_FutureRecordMetadata_get_callback_t", "kafka_producer_FutureRecordMetadata_get_all_callback_t", "kafka_producer_Producer_flush_callback_t", "kafka_producer_Producer_close_callback_t", "kafka_consumer_Consumer_t", "kafka_consumer_ConsumerProperties_t", "kafka_consumer_ConsumerRecords_t", "kafka_consumer_ConsumerRecord_t", "kafka_consumer_Consumer_poll_callback_t", "kafka_consumer_Consumer_op_callback_t", "kafka_consumer_Consumer_commit_async_callback_t", "kafka_consumer_Consumer_commit_async_user_data_destroy_t", "kafka_consumer_Consumer_position_callback_t", "kafka_consumer_Consumer_committed_callback_t", "kafka_consumer_Consumer_offsets_for_times_callback_t", "kafka_consumer_Consumer_long_offsets_callback_t", "kafka_consumer_Consumer_partitions_for_callback_t", "kafka_consumer_Consumer_list_topics_callback_t", "kafka_consumer_TopicPartition_t", "kafka_consumer_TopicPartitionList_t", "kafka_consumer_StringList_t", "kafka_consumer_OffsetAndMetadata_t", "kafka_consumer_OffsetAndTimestamp_t", "kafka_consumer_ConsumerGroupMetadata_t", "kafka_consumer_PartitionInfo_t", "kafka_consumer_PartitionInfoList_t", "kafka_common_Node_t", "kafka_consumer_OffsetMap_t", "kafka_consumer_OffsetAndTimestampMap_t", "kafka_consumer_LongOffsetMap_t", "kafka_consumer_TopicPartitionInfoMap_t", "kafka_consumer_MetricMap_t"]
item_types = ["functions", "structs", "typedefs"]

[fn]
prefix = ""
args = "Vertical"

[enum]
prefix_with_name = true
