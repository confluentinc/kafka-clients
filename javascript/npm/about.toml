# The cargo-about configuration of THIRD_PARTY_LICENSES.txt, the third-party licence file every
# platform package of the Node.js client ships (javascript/npm/README.md): the licences of the
# crates the Rust core links into the addon, the confluent-kafka crate with its `ffi` feature, as
# .semaphore/build-ffi-library.sh builds it. Only what is linked counts: no build or dev
# dependency, and only the targets of the platform packages.
#
#   cargo about generate --locked --manifest-path rust/Cargo.toml --features ffi --fail \
#       -c javascript/npm/about.toml -o THIRD_PARTY_LICENSES.txt javascript/npm/about.hbs
#
# (.semaphore/third-party-licenses.sh runs it.) A crate whose licence is not accepted below fails
# the build: adding one to `accepted` is a licensing decision, made with whoever owns the
# release.

ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
]

# The repository's own proc-macro crate, a build-time macro of the core: its manifest names no
# licence, but it is part of this repository and under its Apache-2.0 LICENSE, as the core is.
[ffi-macros.clarify]
license = "Apache-2.0"

[[ffi-macros.clarify.files]]
path = "../../LICENSE"
license = "Apache-2.0"
checksum = "1120dd122318957ae6616d387650cd7b465bbbdfc6c7e8c7f33f79a385aead14"
