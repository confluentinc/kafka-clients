[workspace]
members = [".", "generator", "xtask"]

[package]
name = "confluent-kafka-rust"
version = "0.1.0"
edition = "2024"

[features]
integration-tests = []
ffi = ["dep:cbindgen"]

[lib]
name = "confluent_kafka"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
generator = { path = "generator" }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "time", "sync"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["logging", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
indexmap = "2"
log = "0.4"
flate2 = "1"
snap = "1"
lz4_flex = "0.11"
zstd = "0.13"
crc32c = "0.6"
dashmap = "6"
futures-util = "0.3"
base64 = "0.22"
bytes = "1"

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka"] }
rcgen = "0.13"


[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
generator = { path = "generator" }
cbindgen = { version = "0.29", optional = true }
