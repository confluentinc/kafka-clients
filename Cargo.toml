[workspace]
members = [".", "generator", "xtask"]

[package]
name = "confluent-kafka-rust"
version = "0.1.0"
edition = "2024"

[features]
skip-generated = []

[dependencies]
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
generator = { path = "generator" }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
generator = { path = "generator" }
