[workspace]
members = [".", "generator", "xtask"]

[package]
name = "confluent-kafka-rust"
version = "0.1.0"
edition = "2024"

[features]
integration-tests = []
ffi = ["dep:cbindgen"]

[lib]
name = "confluent_kafka"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
generator = { path = "generator" }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "time", "sync"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["logging", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
indexmap = "2"
log = "0.4"
flate2 = "1"
snap = "1"
lz4_flex = "0.11"
zstd = "0.13"
# `twox-hash` is already pulled in transitively by `lz4_flex`. We promote it
# to a direct dep because Phase 3c's `Lz4BlockOutputStream` reproduces Kafka's
# LZ4 frame XXH32 header/block checksum bytewise — the framing differs from
# `lz4_flex`'s default (which omits the header) and must match Java's
# `net.jpountz.xxhash.XXHash32` byte-for-byte.
twox-hash = { version = "2", features = ["xxhash32"] }
crc32c = "0.6"
dashmap = "6"
futures-util = "0.3"
base64 = "0.22"
bytes = "1"
# `arc-swap` provides lock-free atomic Arc reads/swaps, which is the closest
# Rust analogue of Java's `volatile Arc<T>` semantics. Used in
# `crate::metadata::Metadata` to replace mutex-guarded reads of
# `metadata_snapshot` on the producer hot path (every `KafkaProducer.send`
# looks up partitioning metadata via `Metadata::fetch`); see
# `Metadata.java:79,129-138` where `metadataSnapshot` is `volatile` and the
# accessors are not `synchronized`.
arc-swap = "1"

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka"] }
rcgen = "0.13"
tempfile = "3"


[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
generator = { path = "generator" }
cbindgen = { version = "0.29", optional = true }
