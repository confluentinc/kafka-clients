[workspace]
members = [".", "generator", "xtask"]

[package]
name = "confluent-kafka-rust"
version = "0.1.0"
edition = "2024"

[features]
skip-generated = []
integration-tests = []

[dependencies]
async-trait = "0.1"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "rt", "sync", "time", "macros"] }
generator = { path = "generator" }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
indexmap = "2"
log = "0.4"

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka"] }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
generator = { path = "generator" }
