language = "C"
# Use "Type" style so function signatures use the typedef name
# (e.g. kafka_producer_ProducerRecord_t *) without the "struct" keyword.
style = "Type"
# Printed above the include guard. The same contract opens the `src/ffi/mod.rs`
# module docs; `#[ffi_guard]` (crate `ffi-macros`) implements it.
header = """
/*
 * Panics never cross this API.
 *
 * Every function declared here catches a Rust panic before it can unwind into
 * its caller, which would abort the process, and reports it instead. A
 * fallible function returns the panic as its kafka_common_Error_t * and leaves
 * its out_<name> parameters unwritten, as for any other failure: read them
 * only after a NULL return. The error's code is
 * kafka_common_ErrorCode_LOCAL_ILLEGAL_STATE and its message begins
 * "Rust panic caught at the FFI boundary in <function>". Any other function
 * returns the failure value of its return type:
 *   - a pointer: NULL;
 *   - an int8_t: 0, false for a boolean. An int8_t carrying a Java byte code
 *     whose 0 is a valid constant (kafka_common_IsolationLevel_id, say)
 *     returns -1 instead, as its documentation states;
 *   - another integer: -1, but 0 for a *_count or *_size accessor, a size
 *     that returns -1 for a null key or value
 *     (kafka_consumer_ConsumerRecord_serialized_key_size) included. An
 *     integer whose Java domain holds that value but leaves out another one
 *     returns the other instead, as its documentation states
 *     (kafka_admin_NewTopic_replication_factor returns 0);
 *   - a double: NaN;
 *   - a kafka_Bytes_t: a NULL one (Java's null array);
 *   - kafka_common_ErrorCode_e (kafka_common_Error_code):
 *     kafka_common_ErrorCode_UNKNOWN_SERVER_ERROR; another C enum: the
 *     enumerator its documentation names, its UNKNOWN one when it has one;
 *   - a borrowed const kafka_common_Error_t * (kafka_common_Error_source):
 *     NULL, as for no error.
 * A function returning nothing only logs the panic.
 *
 * The failure value is not always distinct from a real answer: a nullable
 * pointer or kafka_Bytes_t, a boolean, a double that may be NaN, a C enum
 * without an UNKNOWN enumerator, and an integer whose -1 (or, for a count or
 * size, 0) is itself a valid value return a value the function can also
 * return without a panic. The integers include Java's sentinels: an absent
 * leader epoch, NO_TIMESTAMP, an unknown offset or partition, the id of
 * Node.noNode(), kafka_admin_AbortTransactionSpec_producer_epoch, an unset
 * optional value. Such a panic shows only in the error-level log line every
 * caught panic writes.
 *
 * A _cb function reports a caught panic the way it reports every other
 * outcome: it queues its completion, carrying the error and the caller's
 * opaque, on the client's callback queue, exactly once, and the client's
 * __execute_callbacks runs it like any other completion. That completion is
 * where opaque comes back to be released; there is no other release hook.
 *
 * A panic is a bug in this library and may leave the handle it happened on in
 * an inconsistent state: destroy that handle and create a new one. Later calls
 * on it can keep failing, because a poisoned lock is never cleared; its
 * _destroy still frees it and runs its pending callbacks, each exactly once.
 */"""
include_guard = "CONFLUENT_KAFKA_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]

[export]
# Every `#[repr(C)]` type and `pub type` typedef the `ffi` module declares is
# exported: the FFI is the only module that defines C-named (`kafka_*`) items,
# and `item_types` leaves the crate's `pub const`s out. `cargo xtask lint-custom`
# (`check-ffi-translation`) ties each exported name to its Rust item.
# "enums" is needed for kafka_common_ErrorCode_e; without it cbindgen emits no
# enum at all.
item_types = ["functions", "structs", "typedefs", "enums"]

[fn]
prefix = ""
args = "Vertical"

[enum]
# Off for every C enum: CLAUDE.md §4 ("Enums") names an enumerator
# `<prefix>_<VALUE>` (the enum's prefix without its `_e` suffix, the key in
# constant case), while cbindgen would prefix with the export name and put the
# `_e` into every enumerator. The Rust variants are spelled out in full
# instead, so the Rust identifier is the C name (checked by
# `cargo xtask lint-custom check-ffi-translation`).
prefix_with_name = false
