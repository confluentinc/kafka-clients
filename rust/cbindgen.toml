language = "C"
# Use "Type" style so function signatures use the typedef name
# (e.g. kafka_producer_ProducerRecord_t *) without the "struct" keyword.
style = "Type"
# Printed above the include guard. The same contract opens the `src/ffi/mod.rs`
# module docs; `#[ffi_guard]` (crate `ffi-macros`) implements it.
header = """
/*
 * Panics never cross this API.
 *
 * Every function declared here catches a Rust panic before it can unwind into
 * its caller. A NULL passed for a mandatory parameter (a handle, a string, a
 * collection, a function pointer) is reported as such a panic, carrying the
 * error Java throws there: Java's own error and message where Java checks the
 * argument, else a kafka_common_Error_LOCAL_NULL_POINTER (Java's
 * NullPointerException) whose message is "<parameter> must not be null". A
 * parameter documented as nullable, and the handle a _destroy function frees,
 * may be NULL. Any other panic is a bug in this library: its error has the
 * code kafka_common_Error_LOCAL_ILLEGAL_STATE and a message beginning "Rust
 * panic caught at the FFI boundary in <function>".
 *
 * A fallible function takes a trailing kafka_common_Error_t **out_err, and
 * *out_err must be NULL on entry. On failure, a caught panic included, the
 * function stores an owned error in *out_err, which the caller frees with
 * kafka_common_Error_destroy, and returns NULL for a pointer, a NULL
 * kafka_Bytes_t, 0 for an int8_t, -1 for another integer, NaN for a double
 * and an enumerator its documentation names for a C enum; on success it
 * leaves *out_err untouched. Test *out_err, not the value: NULL and -1 can be
 * valid answers. A NULL out_err leaves nothing to carry an error, so the
 * process aborts when there is one. The function pointers a caller
 * implements and that can fail (a Serializer's and a Deserializer's methods,
 * Headers' add and remove, KafkaFuture_BaseFunction's apply) take the same
 * trailing out_err: they fail by storing an owned error there, and their
 * return value is then ignored.
 *
 * A _cb function reports a caught panic the way it reports every other
 * outcome, exactly once, whether the panic happens on the calling thread or
 * later on the task running the operation: its completion carries the error
 * (and a NULL pointer, or -1 for an int64_t, as its value) and the caller's
 * opaque, queued on the client's callback queue for the client's
 * __execute_callbacks to run like any other completion. A handle with no
 * callback queue (a standalone listener or OffsetCommitCallback, a future of
 * no client, a ConsumerHandle whose consumer is destroyed) runs it on the
 * calling thread before returning, as it runs every completion; so does a
 * NULL self_, which has no queue to reach. A completion
 * with no error parameter (kafka_admin_Admin_close_cb,
 * kafka_admin_Admin_close_with_timeout_cb,
 * kafka_producer_Callback_on_completion_cb) fires with opaque
 * alone, the panic showing only in the log. That completion is where opaque
 * comes back to be released; there is no other release hook. A NULL
 * completion leaves nothing to carry an error, so the process aborts when
 * there is one.
 *
 * Any other function has no error channel: on a caught panic, a NULL
 * mandatory argument included, it prints the error to stderr, logs it and
 * aborts the process. A language binding includes confluent_kafka_bindings.h
 * instead, whose _err twins report it through out_err.
 *
 * A panic that is a bug may leave the handle it happened on in an
 * inconsistent state: destroy that handle and create a new one. Later calls on
 * it can keep failing, because a poisoned lock is never cleared; its _destroy
 * still frees it and runs its pending callbacks, each exactly once. A NULL
 * argument is reported before anything is touched.
 */"""
include_guard = "CONFLUENT_KAFKA_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]

[export]
# Every `#[repr(C)]` type and `pub type` typedef the `ffi` module declares is
# exported: the FFI is the only module that defines C-named (`kafka_*`) items,
# and `item_types` leaves the crate's `pub const`s out. `cargo xtask lint-custom`
# (`check-ffi-translation`) ties each exported name to its Rust item.
# "enums" is needed for kafka_common_Error_e; without it cbindgen emits no
# enum at all.
item_types = ["functions", "structs", "typedefs", "enums"]

[fn]
prefix = ""
args = "Vertical"

[enum]
# Off for every C enum: CLAUDE.md §4 ("Enums") names an enumerator
# `<prefix>_<VALUE>` (the enum's prefix without its `_e` suffix, the key in
# constant case), while cbindgen would prefix with the export name and put the
# `_e` into every enumerator. The Rust variants are spelled out in full
# instead, so the Rust identifier is the C name (checked by
# `cargo xtask lint-custom check-ffi-translation`).
prefix_with_name = false
