language = "C"
# Use "Type" style so function signatures use the typedef name
# (e.g. kafka_producer_ProducerRecord_t *) without the "struct" keyword.
style = "Type"
# Printed above the include guard. The same contract opens the `src/ffi/mod.rs`
# module docs; `#[ffi_guard]` (crate `ffi-macros`) implements it.
header = """
/*
 * Panics never cross this API.
 *
 * Every function declared here catches a Rust panic before it can unwind into
 * its caller, which would abort the process. After a caught panic the function
 * returns its failure value instead: NULL, false, -1 (0 for a *_count
 * accessor), NaN for a double, kafka_common_ErrorCode_UNKNOWN_SERVER_ERROR for
 * kafka_common_Error_code, or an error handle for a function that returns one.
 * A function with an out_error parameter also stores an error describing the
 * panic there. A function that reports ordinary failures through a completion
 * callback reports the panic through that callback instead, exactly once,
 * unless its documentation says that a synchronous failure does not invoke the
 * callback. Such a function reports the panic as a synchronous failure,
 * through its return value and out_error where it has one, and the guard
 * itself does not invoke the callback. If such a panic is raised after the
 * record or request was already handed to the library's background work, the
 * callback can still fire for it later; on a return that reports a panic, do
 * not release user_data yourself: the callback, or the user_data_destroy hook
 * where there is one, releases it when it runs. The error's code is
 * kafka_common_ErrorCode_LOCAL_ILLEGAL_STATE and its message begins
 * "Rust panic caught at the FFI boundary in <function>".
 *
 * A panic is a bug in this library and may leave the handle it happened on in
 * an inconsistent state: destroy that handle and create a new one. Later calls
 * on it can keep failing, because a poisoned lock is never cleared.
 */"""
include_guard = "CONFLUENT_KAFKA_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]

[export]
# Every `#[repr(C)]` type and `pub type` typedef the `ffi` module declares is
# exported: the FFI is the only module that defines C-named (`kafka_*`) items,
# and `item_types` leaves the crate's `pub const`s out. `cargo xtask lint-custom`
# (`check-ffi-translation`) ties each exported name to its Rust item.
# "enums" is needed for kafka_common_ErrorCode_e; without it cbindgen emits no
# enum at all.
item_types = ["functions", "structs", "typedefs", "enums"]

[fn]
prefix = ""
args = "Vertical"

[enum]
# Off for every C enum: CLAUDE.md §4 ("Enums") names an enumerator
# `<prefix>_<VALUE>` (the enum's prefix without its `_e` suffix, the key in
# constant case), while cbindgen would prefix with the export name and put the
# `_e` into every enumerator. The Rust variants are spelled out in full
# instead, so the Rust identifier is the C name (checked by
# `cargo xtask lint-custom check-ffi-translation`).
prefix_with_name = false
