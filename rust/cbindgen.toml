language = "C"
# Use "Type" style so function signatures use the typedef name
# (e.g. kafka_producer_ProducerRecord_t *) without the "struct" keyword.
style = "Type"
include_guard = "CONFLUENT_KAFKA_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]

[export]
# Every `#[repr(C)]` type and `pub type` typedef the `ffi` module declares is
# exported: the FFI is the only module that defines C-named (`kafka_*`) items,
# and `item_types` leaves the crate's `pub const`s out. `cargo xtask lint-custom`
# (`check-ffi-translation`) ties each exported name to its Rust item.
# "enums" is needed for kafka_common_ErrorCode_e; without it cbindgen emits no
# enum at all.
item_types = ["functions", "structs", "typedefs", "enums"]

[fn]
prefix = ""
args = "Vertical"

[enum]
# Global default; kafka_common_ErrorCode_e overrides it locally with a
# `cbindgen:prefix-with-name=false` annotation, because prefixing with the
# export name would push the `_t` suffix into all 162 enumerators.
prefix_with_name = true
