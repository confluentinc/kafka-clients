[package]
name = "multilanguage-test-server"
version = "1.1.0-rc.1"
edition = "2024"
publish = false
description = "Proto definitions and generated tonic stubs for the multilanguage integration test harness."
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[lints.clippy]
# See the root Cargo.toml: `#[expect]`, never `#[allow]`.
allow_attributes = "deny"
# Every generated service method returns `Result<_, tonic::Status>`, whose
# error (176 bytes) is over the lint's limit; the signature is tonic's, so the
# error cannot be boxed. Clippy 1.100 reports it and 1.95 does not, so an
# `#[expect]` would fail on one of the two: the level is set here instead, which
# both accept and `allow_attributes` does not cover.
result_large_err = "allow"
