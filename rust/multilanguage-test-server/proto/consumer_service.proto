// gRPC service exposing the org.apache.kafka.clients.consumer.Consumer
// trait for the multilanguage integration test harness.
//
// Used by:
//   - the Rust MultilanguageConsumer client (under tests/common)
//   - the Python gRPC server (python/grpc_server.py)
//   - the C++ gRPC server (c/grpc_server/server.cc)
//
// Same package as producer_service.proto; shared messages (KafkaError,
// PartitionInfo, Node, Header, StatusResponse, PartitionsForResponse) are
// imported and reused.
//
// Scope: only the consumer surface the C FFI / Python binding support is
// modeled. Both user callbacks ARE now bridged by the bindings, so they are
// modeled here too — but as *flags plus a log* rather than as reverse RPCs:
// SubscribeRequest.with_listener asks the server to register a real
// ConsumerRebalanceListener, CommitAsyncRequest.with_callback a real
// OffsetCommitCallback, and GetCallbackLog reads back what those callbacks
// actually observed (see CallbackLogEntry in producer_service.proto for the
// encoding, which both services share). A reverse callback RPC would only test
// the harness's own plumbing; the log tests the binding.
//
// Pattern subscription crosses too: Java's subscribe(SubscriptionPattern[,
// listener]), the broker-side RE2/J form (KIP-848), through
// SubscribeRequest.pattern. Only the client-side java.util.regex.Pattern
// overloads stay out, because they are not translated at all.
//
// Like the producer service, blocking methods are awaited server-side: the
// unary RPC response IS the resolved result (no future/streaming on the wire).

syntax = "proto3";

package confluent.kafka.test;

import "producer_service.proto";

service ConsumerService {
  // Construct a new consumer (KafkaConsumer or MockConsumer depending on
  // config) and return an opaque server-local id.
  rpc CreateConsumer(CreateConsumerRequest) returns (CreateConsumerResponse);

  // Subscription / assignment.
  rpc Subscribe(SubscribeRequest) returns (StatusResponse);
  rpc Unsubscribe(ConsumerIdRequest) returns (StatusResponse);
  rpc Assign(AssignRequest) returns (StatusResponse);

  // Fetch a batch of records (server awaits poll(timeout)).
  rpc Poll(PollRequest) returns (PollResponse);

  // Offset commit (empty offsets => commit current positions).
  rpc CommitSync(CommitSyncRequest) returns (StatusResponse);
  // Asynchronous commit. Returns as soon as the commit is *initiated*; when
  // with_callback is set the server registers a real OffsetCommitCallback whose
  // invocations land in the callback log (see GetCallbackLog). The callback
  // fires on a later Poll/CommitSync/Close, exactly as in Java.
  rpc CommitAsync(CommitAsyncRequest) returns (StatusResponse);
  rpc Committed(CommittedRequest) returns (CommittedResponse);
  rpc Position(PositionRequest) returns (PositionResponse);

  // Seeking.
  rpc Seek(SeekRequest) returns (StatusResponse);
  rpc SeekToBeginning(TopicPartitionListRequest) returns (StatusResponse);
  rpc SeekToEnd(TopicPartitionListRequest) returns (StatusResponse);

  // Flow control.
  rpc Pause(TopicPartitionListRequest) returns (StatusResponse);
  rpc Resume(TopicPartitionListRequest) returns (StatusResponse);

  // Offset lookups.
  rpc BeginningOffsets(TopicPartitionListRequest) returns (LongOffsetsResponse);
  rpc EndOffsets(TopicPartitionListRequest) returns (LongOffsetsResponse);
  rpc OffsetsForTimes(OffsetsForTimesRequest) returns (OffsetAndTimestampResponse);

  // Metadata.
  rpc PartitionsFor(ConsumerPartitionsForRequest) returns (PartitionsForResponse);
  rpc ListTopics(ConsumerIdRequest) returns (ListTopicsResponse);

  // Non-blocking state reads.
  rpc Assignment(ConsumerIdRequest) returns (TopicPartitionListResponse);
  rpc Subscription(ConsumerIdRequest) returns (SubscriptionResponse);
  rpc Paused(ConsumerIdRequest) returns (TopicPartitionListResponse);

  // Metrics snapshot.
  rpc Metrics(ConsumerIdRequest) returns (MetricsResponse);

  // Java groupMetadata(). The server keeps the binding's group-metadata handle
  // in an id -> handle store shared with ProducerService, and returns its id
  // together with the fields read through the handle's accessors. The id is
  // what SendOffsetsToTransactionRequest carries. The handle stays in the
  // store, even after the consumer closes, until ReleaseGroupMetadata.
  rpc GroupMetadata(ConsumerIdRequest) returns (GroupMetadataResponse);

  // Destroy a handle GroupMetadata stored. The Rust client issues it when the
  // last reference to its metadata object is dropped. Unknown ids are ignored.
  rpc ReleaseGroupMetadata(ReleaseGroupMetadataRequest) returns (StatusResponse);

  // Signalling / lifecycle.
  rpc Wakeup(ConsumerIdRequest) returns (StatusResponse);
  rpc Close(ConsumerCloseRequest) returns (StatusResponse);

  // Java currentLag(TopicPartition): the lag the consumer computed from its
  // last fetch, without a remote call. Absent `lag` is Java's
  // `OptionalLong.empty()`.
  rpc CurrentLag(CurrentLagRequest) returns (CurrentLagResponse);

  // Read (without clearing) the consumer's user-callback log — every rebalance
  // listener and offset-commit callback invocation the server's binding has
  // performed so far. CallbackLogEntry / CallbackLogResponse are defined in
  // producer_service.proto and shared by both services.
  rpc GetCallbackLog(CallbackLogRequest) returns (CallbackLogResponse);

  // Give the logging listener that the consumer's NEXT Subscribe with
  // with_listener = true registers a script per method: the calls back into
  // the consumer (and the sleeps and failures) Java's test listeners make from
  // inside on_partitions_assigned / on_partitions_revoked / on_partitions_lost,
  // the in-callback reentrancy of consumer-threading.md §31. On an invocation
  // its trigger selects, the listener first logs the invocation as usual
  // ("assigned" / "revoked" / "lost"), then runs the steps in order through
  // its binding's own reentrancy path (Python: the consumer object, called
  // from inside the listener; C: the kafka_consumer_ConsumerHandle_* entry
  // points of kafka_consumer_Consumer_handle), logging each step as its own
  // "listener_action" entry (see CallbackLogEntry in producer_service.proto).
  // The scripts belong to that one registration: a later Subscribe with a
  // listener and no new SetListenerAction registers a plain logging listener
  // again. A request with no script clears a pending one.
  rpc SetListenerAction(ListenerActionRequest) returns (StatusResponse);
}

// ---------------------------------------------------------------------------
// Common
// ---------------------------------------------------------------------------

message ConsumerIdRequest {
  uint64 consumer_id = 1;
}

message GroupMetadataResponse {
  // Server-local group-metadata handle id; 0 on failure.
  uint64 group_metadata_id = 1;
  // The handle's fields, so the client can answer the accessors locally.
  ConsumerGroupMetadata group_metadata = 2;
  // Set on failure (e.g. unknown consumer_id).
  optional KafkaError error = 3;
}

message ReleaseGroupMetadataRequest {
  uint64 group_metadata_id = 1;
}

message TopicPartition {
  string topic = 1;
  int32 partition = 2;
}

message TopicPartitionList {
  repeated TopicPartition partitions = 1;
}

message StringList {
  repeated string values = 1;
}

// ---------------------------------------------------------------------------
// Lifecycle
// ---------------------------------------------------------------------------

message CreateConsumerRequest {
  // ConsumerConfig key/value properties. At minimum "bootstrap.servers" and
  // "group.protocol=consumer" for a real KafkaConsumer; an empty config
  // selects a MockConsumer.
  map<string, string> config = 1;
}

message CreateConsumerResponse {
  uint64 consumer_id = 1;
  optional KafkaError error = 2;
}

message ConsumerCloseRequest {
  uint64 consumer_id = 1;
  // Was `timeout_ms`, carrying Java's deprecated `close(Duration)`, which is
  // not translated.
  reserved 2;
  reserved "timeout_ms";
  // Java's `close(CloseOptions)` when set, the no-argument `close()` when
  // absent: the `CloseOptions.GroupMembershipOperation` constant *name*
  // ("LEAVE_GROUP", "REMAIN_IN_GROUP" or "DEFAULT"), since that enum has no
  // numeric id in Java. Every CloseOptions has an operation (DEFAULT unless
  // set), so its presence alone selects the overload.
  optional string group_membership_operation = 3;
  // `CloseOptions.timeout()`, read only with `group_membership_operation`;
  // absent is the options' unset timeout (the consumer's default).
  optional int64 close_timeout_ms = 4;
}

// ---------------------------------------------------------------------------
// Subscription / assignment
// ---------------------------------------------------------------------------

message SubscribeRequest {
  uint64 consumer_id = 1;
  repeated string topics = 2;
  // When true the server subscribes *with* a ConsumerRebalanceListener that
  // appends "assigned" / "revoked" / "lost" entries to the consumer's callback
  // log (GetCallbackLog); when false it calls the plain subscribe(topics).
  //
  // Registering a listener is per-subscribe: a later listener-less Subscribe
  // releases it (matching SubscriptionState, which only clears the listener on
  // a *replacing* subscribe — never on unsubscribe). Entries already logged are
  // not affected.
  bool with_listener = 3;
  // Java's `subscribe(SubscriptionPattern[, listener])` when set: the RE2/J
  // regex the group coordinator evaluates (KIP-848). `topics` must then be
  // empty; `with_listener` applies to either form.
  optional string pattern = 4;
}

message AssignRequest {
  uint64 consumer_id = 1;
  repeated TopicPartition partitions = 2;
}

// Shared by assign-shaped ops: seek_to_beginning/end, pause, resume,
// beginning_offsets, end_offsets.
message TopicPartitionListRequest {
  uint64 consumer_id = 1;
  repeated TopicPartition partitions = 2;
  // The `Duration timeout` of Java's `beginningOffsets` / `endOffsets`
  // overloads; absent calls the overload without it. The other RPCs sharing
  // this message have no timed overload and ignore it.
  optional int64 timeout_ms = 3;
}

// ---------------------------------------------------------------------------
// Poll
// ---------------------------------------------------------------------------

message PollRequest {
  uint64 consumer_id = 1;
  int64 timeout_ms = 2;
}

message ConsumerRecord {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3;
  int64 timestamp = 4;
  int32 timestamp_type = 5;
  optional bytes key = 6;
  optional bytes value = 7;
  repeated Header headers = 8;
  optional int32 leader_epoch = 9;
}

message ConsumerRecordList {
  repeated ConsumerRecord records = 1;
}

message PollResponse {
  oneof result {
    ConsumerRecordList records = 1;
    KafkaError error = 2;
  }
}

// ---------------------------------------------------------------------------
// Offsets / commit
// ---------------------------------------------------------------------------

message OffsetAndMetadata {
  int64 offset = 1;
  string metadata = 2;
  optional int32 leader_epoch = 3;
}

message OffsetAndTimestamp {
  int64 offset = 1;
  int64 timestamp = 2;
  optional int32 leader_epoch = 3;
}

message OffsetMapEntry {
  TopicPartition partition = 1;
  // Unset for a partition with no committed offset (Java's null value) in
  // `committed`'s result.
  OffsetAndMetadata offset = 2;
}

message OffsetMap {
  repeated OffsetMapEntry entries = 1;
}

message CommitSyncRequest {
  uint64 consumer_id = 1;
  // Empty => commit the current consumed positions; otherwise commit these.
  repeated OffsetMapEntry offsets = 2;
  // Java's `commitSync(Duration)` / `commitSync(Map, Duration)`; absent calls
  // the overload without a timeout.
  optional int64 timeout_ms = 3;
}

// Same offsets shape as CommitSyncRequest, plus the callback flag.
message CommitAsyncRequest {
  uint64 consumer_id = 1;
  // Empty => commit the current consumed positions; otherwise commit these.
  repeated OffsetMapEntry offsets = 2;
  // When true the server passes a real OffsetCommitCallback that appends a
  // "commit" entry to the consumer's callback log.
  bool with_callback = 3;
}

message CommittedRequest {
  uint64 consumer_id = 1;
  repeated TopicPartition partitions = 2;
  // Java's `committed(Set, Duration)`; absent calls the overload without it.
  optional int64 timeout_ms = 3;
}

message CommittedResponse {
  oneof result {
    OffsetMap offsets = 1;
    KafkaError error = 2;
  }
}

message PositionRequest {
  uint64 consumer_id = 1;
  TopicPartition partition = 2;
  // Java's `position(TopicPartition, Duration)`; absent calls the overload
  // without it.
  optional int64 timeout_ms = 3;
}

message PositionResponse {
  oneof result {
    int64 offset = 1;
    KafkaError error = 2;
  }
}

message SeekRequest {
  uint64 consumer_id = 1;
  TopicPartition partition = 2;
  int64 offset = 3;
  // Present for seek(OffsetAndMetadata); absent for seek(offset).
  optional int32 leader_epoch = 4;
  optional string metadata = 5;
}

message LongOffsetMapEntry {
  TopicPartition partition = 1;
  int64 offset = 2;
}

message LongOffsetMap {
  repeated LongOffsetMapEntry entries = 1;
}

message LongOffsetsResponse {
  oneof result {
    LongOffsetMap offsets = 1;
    KafkaError error = 2;
  }
}

message TimestampSpecEntry {
  TopicPartition partition = 1;
  int64 timestamp = 2;
}

message OffsetsForTimesRequest {
  uint64 consumer_id = 1;
  repeated TimestampSpecEntry timestamps = 2;
  // Java's `offsetsForTimes(Map, Duration)`; absent calls the overload
  // without it.
  optional int64 timeout_ms = 3;
}

message OffsetAndTimestampMapEntry {
  TopicPartition partition = 1;
  OffsetAndTimestamp offset = 2;
}

message OffsetAndTimestampMap {
  // Every requested partition is present; one the broker could not resolve
  // (Java's null value) has no `offset`.
  repeated OffsetAndTimestampMapEntry entries = 1;
}

message OffsetAndTimestampResponse {
  oneof result {
    OffsetAndTimestampMap offsets = 1;
    KafkaError error = 2;
  }
}

// ---------------------------------------------------------------------------
// Metadata / state reads
// ---------------------------------------------------------------------------

message ConsumerPartitionsForRequest {
  uint64 consumer_id = 1;
  string topic = 2;
}
// PartitionsForResponse is reused from producer_service.proto.

message TopicPartitionInfoEntry {
  string topic = 1;
  repeated PartitionInfo partitions = 2;
}

message TopicListing {
  repeated TopicPartitionInfoEntry topics = 1;
}

message ListTopicsResponse {
  oneof result {
    TopicListing topics = 1;
    KafkaError error = 2;
  }
}

message TopicPartitionListResponse {
  oneof result {
    TopicPartitionList partitions = 1;
    KafkaError error = 2;
  }
}

message SubscriptionResponse {
  oneof result {
    StringList topics = 1;
    KafkaError error = 2;
  }
}

message CurrentLagRequest {
  uint64 consumer_id = 1;
  TopicPartition partition = 2;
}

message CurrentLagResponse {
  // Java's `OptionalLong`: absent when the consumer does not know the lag
  // (it has not fetched the partition, or the partition is not assigned).
  optional int64 lag = 1;
  // Set on failure (an unknown consumer_id, or another call holding the
  // consumer, Java's ConcurrentModificationException).
  optional KafkaError error = 2;
}

// ---------------------------------------------------------------------------
// Metrics
// ---------------------------------------------------------------------------
//
// `Metric`, `MetricList`, and `MetricsResponse` are shared with the producer
// service and are defined in producer_service.proto (imported above), alongside
// the other shared messages (KafkaError, Node, PartitionInfo, Header). The
// consumer `Metrics` RPC above takes a `ConsumerIdRequest` and returns that
// shared `MetricsResponse`.

// ---------------------------------------------------------------------------
// Callback log
// ---------------------------------------------------------------------------

// The response (CallbackLogResponse) and entry (CallbackLogEntry) messages are
// declared in producer_service.proto and shared by both services; only the
// request is service-specific because the log is keyed by consumer id here.
message CallbackLogRequest {
  uint64 consumer_id = 1;
}

// One step of a listener script (SetListenerAction). Each step is logged as
// one "listener_action" entry whose `step` is the kind's name without the
// LISTENER_STEP_ prefix ("POSITION", ...). A step whose call fails is logged
// with the error and ends the script (the later steps do not run), as a
// throwing call ends Java's listener body; the listener itself still returns
// normally unless the failed step is FAIL.
enum ListenerStepKind {
  // Never sent; rejected with LOCAL_ILLEGAL_ARGUMENT.
  LISTENER_STEP_UNSPECIFIED = 0;
  // Java's `consumer.assignment()`; logged in `result_partitions`.
  LISTENER_STEP_ASSIGNMENT = 1;
  // Java's `consumer.beginningOffsets(partitions)`; logged in `offsets`.
  LISTENER_STEP_BEGINNING_OFFSETS = 2;
  // Java's `consumer.position(partition)`; logged as {"<partition>": position}.
  LISTENER_STEP_POSITION = 3;
  // Java's `consumer.seek(partition, value)`.
  LISTENER_STEP_SEEK = 4;
  // Java's `consumer.pause(partitions)`.
  LISTENER_STEP_PAUSE = 5;
  // Java's `Thread.sleep(value)` (milliseconds) inside the listener.
  LISTENER_STEP_SLEEP = 6;
  // Java's `consumer.commitSync(Map.of(partition, new
  // OffsetAndMetadata(position)))` with the position the latest POSITION step
  // of this invocation read for `partition`; logged as {"<partition>":
  // committed offset}. Fails with LOCAL_ILLEGAL_STATE when no such POSITION
  // step ran.
  LISTENER_STEP_COMMIT_SYNC_POSITION = 7;
  // The listener method fails with `message`: it raises / returns a
  // LocalIllegalState error, the class the Rust tests return (Java's tests
  // throw `IllegalArgumentException`). Logged first, with that error. How the
  // failure then surfaces from poll() is the binding's own (no rewrapping).
  LISTENER_STEP_FAIL = 8;
}

message ListenerStep {
  ListenerStepKind kind = 1;
  // POSITION, SEEK, COMMIT_SYNC_POSITION: the partition acted on.
  TopicPartition partition = 2;
  // BEGINNING_OFFSETS, PAUSE: the partitions acted on.
  repeated TopicPartition partitions = 3;
  // SEEK: the offset. SLEEP: the milliseconds.
  int64 value = 4;
  // FAIL: the error message.
  string message = 5;
}

// Which invocations of a listener method run its script.
enum ListenerTriggerKind {
  // Never sent; rejected with LOCAL_ILLEGAL_ARGUMENT.
  LISTENER_TRIGGER_UNSPECIFIED = 0;
  // Every invocation.
  LISTENER_TRIGGER_ALWAYS = 1;
  // The first `first_n_calls` invocations of the method (counting every
  // invocation, whatever its partitions).
  LISTENER_TRIGGER_FIRST_N_CALLS = 2;
  // Every invocation whose partitions contain `partition` (Java's
  // `if (!partitions.isEmpty() && partitions.contains(tp))`).
  LISTENER_TRIGGER_WHEN_CONTAINS = 3;
  // The first invocation whose partitions contain `partition`, once.
  LISTENER_TRIGGER_ONCE_WHEN_CONTAINS = 4;
}

message ListenerScript {
  ListenerTriggerKind trigger = 1;
  int32 first_n_calls = 2;
  TopicPartition partition = 3;
  repeated ListenerStep steps = 4;
}

message ListenerActionRequest {
  uint64 consumer_id = 1;
  // An earlier, single-action shape; never released.
  reserved 2 to 5;
  // The script of each listener method; absent runs nothing there.
  ListenerScript on_assigned = 6;
  ListenerScript on_revoked = 7;
  ListenerScript on_lost = 8;
}
