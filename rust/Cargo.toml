# Performance integration tests. `test = false` keeps them out of a plain
# `cargo test` / `cargo test --all-features` (so CI's functional gate never
# runs a latency budget under full-suite load); run them explicitly with
# `cargo test --test performance` or `make test-integration-perf-rust`.
[[test]]
name = "performance"
path = "tests/performance/main.rs"
test = false

# Chaos / fault-injection tests (producer + KIP-848 consumer). `test = false`
# keeps them out of a plain `cargo test`: they stand up a dedicated Docker
# cluster and stop/kill/restart its brokers, so they are slow and destructive.
# Every scenario is also `#[ignore]`. Run one scenario per process, with
# `cargo test --features integration-tests --test chaos -- --ignored --exact run_test::chaos_run`
# or `cargo xtask chaos`. See design/current/chaos-fault-injection-harness.md.
[[test]]
name = "chaos"
path = "tests/chaos/main.rs"
test = false

# The long-running data-integrity run. `test = false` keeps it out of a plain
# `cargo test`; its one scenario is also `#[ignore]`. Run it with
# `cargo xtask integrity-test`. See tests/integrity/README.md.
[[test]]
name = "integrity"
path = "tests/integrity/main.rs"
test = false

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
cbindgen = { version = "0.29", optional = true, features = ["unstable_ir"] }

# Release-build optimizations (Tier 1, zero behavior change): fat LTO + a single
# codegen unit let the optimizer inline across crate boundaries (trait dispatch,
# the per-poll hot path), Rust's AOT counterpart to Java's JIT. NOT panic=abort —
# std Mutex poisoning (consumer-threading.md §16) relies on unwinding.
[profile.release]
lto = "fat"
codegen-units = 1

[lints.clippy]
exhaustive_structs = "deny"
exhaustive_enums = "deny"
# Suppress a lint with `#[expect]`, never `#[allow]`: an expectation the lint no
# longer meets is itself reported (`unfulfilled_lint_expectations`), so a stale
# suppression cannot outlive the code that needed it.
allow_attributes = "deny"
# Every `unsafe` block and `unsafe impl` carries a `// SAFETY:` comment naming the
# invariant it relies on and where that invariant is established — the soundness
# inventory of the FFI layer (NONJAVACLI-4521). The second lint is the inverse: a
# `// SAFETY:` comment left above code that no longer contains `unsafe` is reported,
# so a justification cannot outlive the block it was written for.
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
# A public method returns `impl Future<Output = T> + Send` with an `async move`
# body instead of being an `async fn`, so that `Send` is part of its signature
# rather than inferred from its body (`cargo xtask lint-custom`,
# `check-send-future`). That is the shape this lint rewrites to `async fn`.
manual_async_fn = "allow"
