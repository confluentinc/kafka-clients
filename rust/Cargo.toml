[workspace]
members = [".", "generator/crate", "xtask", "consumer-perf", "multilanguage-test-server", "tools/verifiable-clients"]

[package]
name = "confluent-kafka"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Confluent Rust implementation of the Kafka client, translated from the Apache Kafka Java client."
repository = "https://github.com/confluentinc/kafka-clients"
# What `cargo package` ships: the library, and the generator with the message
# specs `build.rs` compiles into the protocol code. Tests, examples, test-only
# modules and the test message specs stay out. `build.rs` skips the test specs
# when `generator/test-messages` is absent, and every excluded `src` file is
# declared under `#[cfg(test)]`, so the packaged crate still builds. The C FFI
# (`src/ffi`) stays out too: the C and Python bindings build from the
# repository, and `build.rs` rejects `--features ffi` when `src/ffi` is absent.
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/build.rs",
    "/src/**/*.rs",
    "!/src/ffi/**",
    "!/src/**/*_test.rs",
    "!/src/common/message/**",
    "!/src/integration_tests/**",
    "!/src/test_alloc_tracker.rs",
    "!/src/producer/internals/producer_test_utils.rs",
    "/generator/src/**/*.rs",
    "/generator/messages/*.json",
]


[features]
integration-tests = []
# Run the producer integration tests against multiple language backends
# (native Rust, Python via gRPC, C via gRPC). See
# design/history/MILESTONE-6/DESIGN-multilanguage-tests.md for details.
multilanguage-tests = ["integration-tests"]
ffi = ["dep:cbindgen", "dep:env_logger"]

[lib]
name = "confluent_kafka"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
bytes = "1"
ambassador = "0.5"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["logging", "std", "tls12"] }
webpki-roots = "0.26"
indexmap = "2"
# Fast, non-cryptographic hasher (FxHash) for the Selector's internal per-poll
# channel-id maps/sets. The keys are internal connection ids, not attacker-
# controlled, so SipHash's DoS resistance buys nothing while its per-lookup cost
# dominates the high-frequency poll loop (see Phase 22 / TLS CPU profile).
rustc-hash = "2"
log = "0.4"
env_logger = { version = "0.11", optional = true }
flate2 = "1"
snap = "1"
lz4_flex = "0.11"
zstd = "0.13"
crc32c = "0.6"
# IEEE 802.3 / zlib CRC-32 (poly 0x04C11DB7, reflected). Used as the default
# producer key partitioner hash (`KeyHasher::Crc32`), matching librdkafka's
# `consistent_random` partitioner and Python `zlib.crc32`. This is a DIFFERENT
# polynomial from `crc32c` above (CRC-32C/Castagnoli, used for record-batch
# CRCs) — do NOT conflate the two. Already present transitively via `flate2`,
# so this adds no new compiled crate.
crc32fast = "1"
# FIPS-capable crypto backend (already the project's chosen rustls provider, see
# `security/ssl/ssl_factory.rs` installing `rustls::crypto::aws_lc_rs`). Used for
# PBKDF2-HMAC in `ScramFormatter::hi` (SCRAM credential salting, KIP-554). Already
# present transitively via rustls, so this adds no new compiled crate.
# `default-features = false` mirrors rustls's own feature selection: it drops the
# `ring-io`/`ring-sig-verify` compat shims (which would pull an extra `untrusted`
# crate we don't need for PBKDF2), keeping the dependency graph unchanged.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "alloc"] }
dashmap = "6"
futures-util = "0.3"
async-trait = "0.1"

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka"] }
rcgen = "0.13"
tokio-rustls = "0.26"
env_logger = "0.11"
# The consumer example stops on Ctrl-C; the library itself needs no `signal`.
tokio = { version = "1", features = ["signal"] }
# Used by the multilanguage consumer client (impl Consumer is #[async_trait])
# and to build ConsumerRecords.
async-trait = "0.1"
indexmap = "2"
# Used only when --features multilanguage-tests is enabled.
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"
paste = "1"
multilanguage-test-server = { path = "multilanguage-test-server" }

[[test]]
name = "producer"
path = "tests/producer/main.rs"

[[test]]
name = "consumer"
path = "tests/consumer/main.rs"

# Performance integration tests. `test = false` keeps them out of a plain
# `cargo test` / `cargo test --all-features` (so CI's functional gate never
# runs a latency budget under full-suite load); run them explicitly with
# `cargo test --test performance` or `make test-integration-perf-rust`.
[[test]]
name = "performance"
path = "tests/performance/main.rs"
test = false

# Chaos / fault-injection tests (producer + KIP-848 consumer). `test = false`
# keeps them out of a plain `cargo test`: they stand up a dedicated Docker
# cluster and stop/kill/restart its brokers, so they are slow and destructive.
# Every scenario is also `#[ignore]`. Run explicitly with
# `cargo test --features integration-tests --test chaos -- --ignored` or
# `cargo xtask chaos`. See design/current/chaos-fault-injection-harness.md.
[[test]]
name = "chaos"
path = "tests/chaos/main.rs"
test = false

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
cbindgen = { version = "0.29", optional = true }

# Release-build optimizations (Tier 1, zero behavior change): fat LTO + a single
# codegen unit let the optimizer inline across crate boundaries (trait dispatch,
# the per-poll hot path), Rust's AOT counterpart to Java's JIT. NOT panic=abort —
# std Mutex poisoning (consumer-threading.md §16) relies on unwinding.
[profile.release]
lto = "fat"
codegen-units = 1

[lints.clippy]
exhaustive_structs = "deny"
exhaustive_enums = "deny"
# Suppress a lint with `#[expect]`, never `#[allow]`: an expectation the lint no
# longer meets is itself reported (`unfulfilled_lint_expectations`), so a stale
# suppression cannot outlive the code that needed it.
allow_attributes = "deny"
