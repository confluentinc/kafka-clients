version: v1.0
name: Approve plan and implement

# Manual promotion target from semaphore.yml. Triggers on the per-PR
# build; flips the PR's status 2 -> 3 in the sqlite DB and immediately
# runs the implementation step (cascading 3 -> 4) for that single PR.

agent:
  machine:
    type: s1-prod-ubuntu24-04-arm64-2

blocks:
  - name: Approve and implement
    task:
      jobs:
        - name: plan-approve
          commands:
            - checkout
            - sem-version python 3.10
            - artifact pull project translation_agent.db
            - |
              set -e
              if [ -z "${SEMAPHORE_GIT_PR_NUMBER}" ]; then
                echo "ERROR: this promotion must be triggered from a PR build."
                echo "       SEMAPHORE_GIT_PR_NUMBER is unset."
                exit 1
              fi
            - ./.semaphore/dependencies.sh
            - make
            - (cd tools/translation_agent && pip install -e '.[dev]')
            # --ak-repo-path is passed defensively: --plan-approve does
            # not currently exercise dep-eval (it only does 2->3->impl),
            # but if a future refactor ever lets plan-approve fall
            # through into the cascade, the dep-eval step would need
            # the AK repo path. Cheap to pass; avoids a re-trigger
            # of the same TypeError-on-None-path trap that PR-mode hit.
            - translation-agent --ak-repo-path "./kafka"
                --pr "${SEMAPHORE_GIT_PR_NUMBER}" --plan-approve
