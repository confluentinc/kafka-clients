version: v1.0
name: Build Python wheels

# Builds the Python binding wheels with cibuildwheel and verifies them.
#   Build blocks:  compile the C extension (_confluentkafka.c) inside
#     manylinux_2_28 against the Rust library pulled from the artifact store,
#     repair with auditwheel (vendors the .so + stamps the manylinux tag), and
#     push the wheels to the artifact store.
#   Verify blocks: pull the wheels and install + import them (1) on the runner
#     across every Python version, and (2) on bare Linux distro containers via
#     .semaphore/test-wheels.sh -- proving the wheels are self-contained and
#     portable across distros / glibc versions.

agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-3

global_job_config:
  env_vars:
    - name: CIBW_BUILD
      value: cp310-* cp311-* cp312-* cp313-* cp314-*
    - name: CIBW_SKIP
      value: "*musllinux* *i686 *t-*"
    - name: CIBW_MANYLINUX_X86_64_IMAGE
      value: manylinux_2_28
    - name: CIBW_MANYLINUX_AARCH64_IMAGE
      value: manylinux_2_28
  prologue:
    commands:
      - checkout
      - sem-version python 3.11
      - python -m pip install --upgrade pip

blocks:
  - name: "Build wheels: Linux x64"
    dependencies: []
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-amd64-3
      env_vars:
        - name: ARCH
          value: x64
      jobs:
        - name: build
          commands:
            - python -m pip install cibuildwheel==3.2.1
            # Stage the Rust library + header inside the package dir so the
            # cibuildwheel container can see them.
            - mkdir -p bindings/python/native/lib bindings/python/native/include
            - artifact pull workflow rust-linux-${ARCH}/libconfluent_kafka.so --destination bindings/python/native/lib/libconfluent_kafka.so --force
            - artifact pull workflow rust-linux-${ARCH}/confluent_kafka.h --destination bindings/python/native/include/confluent_kafka.h --force
            # cibuildwheel copies the whole repo to /project and builds the
            # subdir, so $PWD is the repo root -- point at bindings/python/native.
            # Keep $PWD literal; cibuildwheel expands it inside the container.
            - export CIBW_ENVIRONMENT='CFLAGS=-I$PWD/bindings/python/native/include CONFLUENT_KAFKA_LIB_DIR=$PWD/bindings/python/native/lib LDFLAGS=-L$PWD/bindings/python/native/lib LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$PWD/bindings/python/native/lib'
            - python -m cibuildwheel --platform linux --output-dir wheelhouse bindings/python
            - ls -l wheelhouse/
            - artifact push workflow wheelhouse --destination wheels-linux-${ARCH} --force

  - name: "Build wheels: Linux arm64"
    dependencies: []
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-arm64-1
      env_vars:
        - name: ARCH
          value: arm64
      jobs:
        - name: build
          commands:
            - python -m pip install cibuildwheel==3.2.1
            - mkdir -p bindings/python/native/lib bindings/python/native/include
            - artifact pull workflow rust-linux-${ARCH}/libconfluent_kafka.so --destination bindings/python/native/lib/libconfluent_kafka.so --force
            - artifact pull workflow rust-linux-${ARCH}/confluent_kafka.h --destination bindings/python/native/include/confluent_kafka.h --force
            - export CIBW_ENVIRONMENT='CFLAGS=-I$PWD/bindings/python/native/include CONFLUENT_KAFKA_LIB_DIR=$PWD/bindings/python/native/lib LDFLAGS=-L$PWD/bindings/python/native/lib LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$PWD/bindings/python/native/lib'
            - python -m cibuildwheel --platform linux --output-dir wheelhouse bindings/python
            - ls -l wheelhouse/
            - artifact push workflow wheelhouse --destination wheels-linux-${ARCH} --force

  - name: "Verify wheels: Linux x64"
    dependencies:
      - "Build wheels: Linux x64"
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-amd64-3
      env_vars:
        - name: ARCH
          value: x64
      jobs:
        - name: verify
          commands:
            - artifact pull workflow wheels-linux-${ARCH} --destination wheelhouse --force
            - ls -l wheelhouse/
            - |
              set -e
              for py in 3.10 3.11 3.12 3.13 3.14; do
                echo "== verifying on Python $py =="
                sem-version python "$py" || { echo "Python $py not available -- skipping"; continue; }
                rm -rf "/tmp/v$py"
                python -m venv "/tmp/v$py"
                . "/tmp/v$py/bin/activate"
                python -m pip install --upgrade pip >/dev/null
                python -m pip install --no-index --find-links wheelhouse confluent-kafka-rust-python
                python -c "import _confluentkafka; print('import OK on Python $py')"
                # Run the binding unit tests against the installed wheel from a
                # neutral dir so 'import producer' resolves to the wheel, not src.
                python -m pip install pytest >/dev/null
                testtmp=$(mktemp -d); cp -r bindings/python/test "$testtmp/"
                ( cd "$testtmp" && python -m pytest test/unit -q )
                rm -rf "$testtmp"
                deactivate
              done
            # Portability check: install + import on bare Linux distros.
            - sh .semaphore/test-wheels.sh wheelhouse

  - name: "Verify wheels: Linux arm64"
    dependencies:
      - "Build wheels: Linux arm64"
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-arm64-1
      env_vars:
        - name: ARCH
          value: arm64
      jobs:
        - name: verify
          commands:
            - artifact pull workflow wheels-linux-${ARCH} --destination wheelhouse --force
            - ls -l wheelhouse/
            - |
              set -e
              for py in 3.10 3.11 3.12 3.13 3.14; do
                echo "== verifying on Python $py =="
                sem-version python "$py" || { echo "Python $py not available -- skipping"; continue; }
                rm -rf "/tmp/v$py"
                python -m venv "/tmp/v$py"
                . "/tmp/v$py/bin/activate"
                python -m pip install --upgrade pip >/dev/null
                python -m pip install --no-index --find-links wheelhouse confluent-kafka-rust-python
                python -c "import _confluentkafka; print('import OK on Python $py')"
                # Run the binding unit tests against the installed wheel from a
                # neutral dir so 'import producer' resolves to the wheel, not src.
                python -m pip install pytest >/dev/null
                testtmp=$(mktemp -d); cp -r bindings/python/test "$testtmp/"
                ( cd "$testtmp" && python -m pytest test/unit -q )
                rm -rf "$testtmp"
                deactivate
              done
            # Portability check: install + import on bare Linux distros.
            - sh .semaphore/test-wheels.sh wheelhouse
