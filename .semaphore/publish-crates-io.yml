version: v1.0
name: publish-crates-io
# Manual promotion target from semaphore.yml. Run it only on a green build of
# the current master tip to publish the confluent-kafka version in
# Cargo.toml; nothing here re-runs the test suite, and any other branch or
# commit is refused. Verify and publish run on separate single-use VMs, so no
# build-time code (build scripts, proc macros) runs on the VM where the
# crates.io token is loaded.
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-2

global_job_config:
  prologue:
    commands:
      - checkout
      # PR builds report the PR's target branch in SEMAPHORE_GIT_BRANCH, so the
      # ref type check is what excludes them.
      # - |
      #   if [ "${SEMAPHORE_GIT_REF_TYPE}" != "branch" ] || [ "${SEMAPHORE_GIT_BRANCH}" != "master" ]; then
      #     echo "Refusing to publish: only a master branch build may publish (ref type '${SEMAPHORE_GIT_REF_TYPE}', branch '${SEMAPHORE_GIT_BRANCH}')" >&2
      #     exit 1
      #   fi
      # Promotions can be clicked on any past master build, and a crates.io
      # version can never be replaced, so only the current tip may publish.
      # - |
      #   git fetch --quiet origin master
      #   if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
      #     echo "Refusing to publish: $(git rev-parse HEAD) is not the current tip of master ($(git rev-parse FETCH_HEAD)); promote the latest master build" >&2
      #     exit 1
      #   fi

blocks:
  - name: "Verify package"
    dependencies: []
    task:
      jobs:
        - name: "cargo package"
          commands:
            # Not dependencies.sh: it initializes the kafka submodule, which the
            # publish block doesn't, and both blocks must package the same tree.
            - sudo apt install -y cmake rustup
            - cd rust
            - cargo package -p confluent-kafka --locked
            # crates.io rejects these at upload; cargo package only warns or doesn't check.
            - |
              cargo metadata --no-deps --format-version 1 | jq -e '.packages[] | select(.name == "confluent-kafka") | ((.description // "") != "") and (((.license // "") != "") or .license_file != null)' >/dev/null \
                || { echo "Refusing to publish: crates.io requires a non-empty description and license (or license-file) in [package]" >&2; exit 1; }
            - |
              size=$(stat -c%s target/package/confluent-kafka-[0-9]*.crate) || exit 1
              if [ "$size" -gt 10485760 ]; then
                echo "Refusing to publish: .crate is ${size} bytes, over crates.io's 10 MiB limit; add an include list to Cargo.toml" >&2
                exit 1
              fi

  - name: "Publish to crates.io"
    dependencies: ["Verify package"]
    task:
      jobs:
        - name: "cargo publish"
          commands:
            - sudo apt install -y rustup
            - cd rust
            - cargo package -p confluent-kafka --locked --list
            # The Vault path keeps the crate's original name.
            - . vault-get-secret --secret-key=CARGO_REGISTRY_TOKEN crates/confluent-kafka-rust
            # Verified in the previous block; --no-verify keeps build-time code
            # off this VM while the token is in the environment.
            - cargo publish -p confluent-kafka --locked --no-verify
