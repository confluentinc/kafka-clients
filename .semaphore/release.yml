            - artifact pull workflow "nuget/built/${NUGET_PACKAGE}.${NUGET_VERSION}.nupkg" --destination "/tmp/package/${NUGET_PACKAGE}.${NUGET_VERSION}.nupkg"
            # The C ABI header of the library this platform loads, for the unit tests' ABI
            # conformance test.
            - artifact pull workflow "nuget/include/${NUGET_RID}/confluent_kafka_bindings.h" --destination /tmp/confluent_kafka_bindings.h
            # Some unit tests read the Java sources in the kafka submodule.
            - retry git submodule update --init --depth=1 kafka
            - sh .semaphore/test-nupkg.sh /tmp/package /tmp/confluent_kafka_bindings.h /tmp/tested.sha256
            - artifact push workflow /tmp/tested.sha256 --destination "nuget/tested/${NUGET_PLATFORM}" --force

  - name: "Release (.NET): package verification (macOS arm64)"
    dependencies: ["Release (.NET): pack"]
    run:
      when: "tag =~ '^dotnet/v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-((alpha|beta|rc)\\.(0|[1-9][0-9]*)(\\.dev\\.(0|[1-9][0-9]*))?|dev\\.(0|[1-9][0-9]*)))?$'"
    execution_time_limit:
      minutes: 60
    task:
      agent:
        machine:
          type: s1-macos-15-arm64-8
      env_vars:
        - name: NUGET_PLATFORM
          value: macos-arm64
        - name: NUGET_RID
          value: osx-arm64
      prologue:
        commands:
          - . .semaphore/job-start.sh
      jobs:
        - name: "Test the package (macOS arm64)"
          commands:
            - ./.semaphore/install-dotnet.sh
            # test-nupkg.sh takes a directory that holds the package and nothing else.
            - mkdir -p /tmp/package
            - NUGET_VERSION=$(python3 .semaphore/check-nupkg.py version) && export NUGET_VERSION
            - artifact pull workflow "nuget/built/${NUGET_PACKAGE}.${NUGET_VERSION}.nupkg" --destination "/tmp/package/${NUGET_PACKAGE}.${NUGET_VERSION}.nupkg"
            # The C ABI header of the library this platform loads, for the unit tests' ABI
            # conformance test.
            - artifact pull workflow "nuget/include/${NUGET_RID}/confluent_kafka_bindings.h" --destination /tmp/confluent_kafka_bindings.h
            # Some unit tests read the Java sources in the kafka submodule.
            - retry git submodule update --init --depth=1 kafka
            - sh .semaphore/test-nupkg.sh /tmp/package /tmp/confluent_kafka_bindings.h /tmp/tested.sha256
            - artifact push workflow /tmp/tested.sha256 --destination "nuget/tested/${NUGET_PLATFORM}" --force

  - name: "Release (.NET): package verification (Windows amd64)"
    dependencies: ["Release (.NET): pack"]
    run:
      when: "tag =~ '^dotnet/v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-((alpha|beta|rc)\\.(0|[1-9][0-9]*)(\\.dev\\.(0|[1-9][0-9]*))?|dev\\.(0|[1-9][0-9]*)))?$'"
    execution_time_limit:
      minutes: 60
    task:
      agent:
        machine:
          type: s1-prod-windows
      env_vars:
        - name: NUGET_PLATFORM
          value: windows-amd64
        - name: NUGET_RID
          value: win-x64
      prologue:
        commands:
          - .\.semaphore\job-start.ps1
      jobs:
        - name: "Test the package (Windows amd64)"
          commands:
            # The version is the one the pack block checked; test-nupkg.ps1 takes a directory
            # that holds the package and nothing else.
            - $env:NUGET_VERSION = (Select-Xml -Path dotnet\Directory.Build.props -XPath '//Version').Node.InnerText.Trim()
            - New-Item -ItemType Directory -Force -Path "$env:TEMP\package" | Out-Null
            - artifact pull workflow "nuget/built/$env:NUGET_PACKAGE.$env:NUGET_VERSION.nupkg" --destination "$env:TEMP\package\$env:NUGET_PACKAGE.$env:NUGET_VERSION.nupkg"
            # The C ABI header of the library this platform loads, for the unit tests' ABI
            # conformance test.
            - artifact pull workflow "nuget/include/$env:NUGET_RID/confluent_kafka_bindings.h" --destination "$env:TEMP\confluent_kafka_bindings.h"
            # Some unit tests read the Java sources in the kafka submodule.
            - git config core.longpaths true
            - foreach ($attempt in 1..3) { git submodule update --init --depth=1 kafka; if ($LASTEXITCODE -eq 0) { break }; if ($attempt -lt 3) { Start-Sleep -Seconds 30 } }
            - .\.semaphore\test-nupkg.ps1 -Platform x64 -PackageDir "$env:TEMP\package" -Header "$env:TEMP\confluent_kafka_bindings.h" -ChecksumFile "$env:TEMP\tested.sha256"
            - artifact push workflow "$env:TEMP\tested.sha256" --destination "nuget/tested/$env:NUGET_PLATFORM" --force

  - name: "Release (.NET): package verification (Windows x86)"
    dependencies: ["Release (.NET): pack"]
    run:
      when: "tag =~ '^dotnet/v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-((alpha|beta|rc)\\.(0|[1-9][0-9]*)(\\.dev\\.(0|[1-9][0-9]*))?|dev\\.(0|[1-9][0-9]*)))?$'"
    execution_time_limit:
