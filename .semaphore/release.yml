      jobs:
        - name: "Test the package (Windows x86)"
          commands:
            # The version is the one the pack block checked; test-nupkg.ps1 takes a directory
            # that holds the package and nothing else.
            - $env:NUGET_VERSION = (Select-Xml -Path dotnet\Directory.Build.props -XPath '//Version').Node.InnerText.Trim()
            - New-Item -ItemType Directory -Force -Path "$env:TEMP\package" | Out-Null
            - artifact pull workflow "nuget/built/$env:NUGET_PACKAGE.$env:NUGET_VERSION.nupkg" --destination "$env:TEMP\package\$env:NUGET_PACKAGE.$env:NUGET_VERSION.nupkg"
            # The C ABI header of the library this platform loads, for the unit tests' ABI
            # conformance test.
            - artifact pull workflow "nuget/include/$env:NUGET_RID/confluent_kafka_bindings.h" --destination "$env:TEMP\confluent_kafka_bindings.h"
            # Some unit tests read the Java sources in the kafka submodule.
            - git config core.longpaths true
            - foreach ($attempt in 1..3) { git submodule update --init --depth=1 kafka; if ($LASTEXITCODE -eq 0) { break }; if ($attempt -lt 3) { Start-Sleep -Seconds 30 } }
            - .\.semaphore\test-nupkg.ps1 -Platform x86 -PackageDir "$env:TEMP\package" -Header "$env:TEMP\confluent_kafka_bindings.h" -ChecksumFile "$env:TEMP\tested.sha256"
            - artifact push workflow "$env:TEMP\tested.sha256" --destination "nuget/tested/$env:NUGET_PLATFORM" --force

  - name: "Release (.NET): packaging"
    # Starts only when the package was tested on every platform. The checks this block makes are
    # listed in release-nupkg.sh; it loads no key.
    dependencies:
      - "Release (.NET): package verification (Linux amd64)"
      - "Release (.NET): package verification (Linux arm64)"
      - "Release (.NET): package verification (macOS arm64)"
      - "Release (.NET): package verification (Windows amd64)"
      - "Release (.NET): package verification (Windows x86)"
    run:
      when: "tag =~ '^dotnet/v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-((alpha|beta|rc)\\.(0|[1-9][0-9]*)(\\.dev\\.(0|[1-9][0-9]*))?|dev\\.(0|[1-9][0-9]*)))?$'"
    execution_time_limit:
      minutes: 20
    task:
      env_vars:
        # The platforms of the verification blocks above, whose checksums are
        # recorded under nuget/tested/<platform>.
        - name: NUGET_PLATFORMS
          value: linux-amd64 linux-arm64 macos-arm64 windows-amd64 windows-x86
      prologue:
        commands:
          - . .semaphore/job-start.sh
      jobs:
        - name: "Package the tested package"
          commands:
            - bash .semaphore/release-nupkg.sh

promotions:
  # Manual. Publishes a Python version to Test PyPI and checks it there
  # (publish-testpypi.yml). Run it on the build of its python/v<version> tag
  # once "Release (Python): packaging" has passed. Its blocks are skipped on
  # any other build, and its publish job refuses unless that block recorded
  # the wheels in this workflow, so starting it from a failed or unrelated
  # pipeline publishes nothing. Its own "Publish to PyPI" promotion
  # (publish-pypi.yml) then publishes the same wheels to PyPI.
  - name: Publish to Test PyPI
    pipeline_file: publish-testpypi.yml
