version: v1.0
name: Seed translation_agent DB

# Run as a Semaphore Task (configured in the project's Tasks tab).
# Inserts or updates the branch_commit cursor for a Rust branch.
#
# Required Task parameters (set when triggering the Task):
#   AK_COMMIT     -- full SHA in the AK repo
# Optional (defaults below match the main pipeline):
#   AK_BRANCH     -- defaults to trunk
#   RUST_BRANCH   -- defaults to master
#   FORCE         -- "True" to overwrite an existing cursor for the same
#                    RUST_BRANCH; "False" (default) errors out if a row
#                    already exists with different values.
#   CLEANUP_PRS   -- "True" to delete every pr_commit row for
#                    RUST_BRANCH before seeding. "False" (default)
#                    leaves them untouched. Use to reset a branch's
#                    PR queue when stale/failed rows would otherwise
#                    be picked up by the next sweep.
#   ALLOW_MISSING_ARTIFACT -- "True" ONLY for the very first bootstrap
#                    of a new project (the DB artifact does not exist
#                    yet). Default "False" makes a transient pull
#                    failure a hard error rather than silently
#                    creating an empty DB and overwriting the
#                    canonical artifact on push. Re-seeds (where the
#                    artifact already exists) MUST omit this flag.

agent:
  machine:
    type: s1-prod-ubuntu24-04-arm64-0

blocks:
  - name: Seed correspondence
    task:
      # No task-level env_vars: declaring AK_BRANCH/RUST_BRANCH/FORCE here
      # would shadow the Task parameter values supplied at trigger time.
      # Defaults are applied shell-side via ${VAR:-default} below.
      jobs:
        - name: seed
          commands:
            - checkout
            - sem-version python 3.10
            - (cd tools/translation_agent && pip install -e '.[dev]')
            # First-ever seed has no artifact yet; subsequent re-seeds do.
            - artifact pull project translation_agent.db || true
            - |
              : "${AK_COMMIT:?AK_COMMIT must be set as a Task parameter}"
            - |
              set -e
              FORCE_FLAG=""
              if [ "${FORCE:-False}" = "True" ]; then
                FORCE_FLAG="--force"
              fi
              CLEANUP_PRS_FLAG=""
              if [ "${CLEANUP_PRS:-False}" = "True" ]; then
                CLEANUP_PRS_FLAG="--cleanup-prs"
              fi
              ALLOW_MISSING_FLAG=""
              if [ "${ALLOW_MISSING_ARTIFACT:-False}" = "True" ]; then
                ALLOW_MISSING_FLAG="--allow-missing-artifact"
              fi
              translation-agent --seed $FORCE_FLAG $CLEANUP_PRS_FLAG $ALLOW_MISSING_FLAG \
                --ak-branch "${AK_BRANCH:-trunk}" \
                --ak-commit "${AK_COMMIT}" \
                --rust-branch "${RUST_BRANCH:-master}"
