version: v1.0
name: Bump version

# Run as a Semaphore Task (the `bump-version` task in service.yml). Sets a new
# version with `make bump-version` on a branch off BASE_BRANCH, pushes it and
# opens a PR against BASE_BRANCH. Nothing is merged, tagged or published: the
# PR's own build runs the checks, the API compatibility check among them.
#
# Required Task parameters:
#   VERSION         -- X.Y.Z, or X.Y.Z-alpha.N / -beta.N / -dev.N / -rc.N. The
#                      Cargo manifests get it as given, the Python packages in
#                      PEP 440 (0.3.0-rc.1 -> 0.3.0rc1, 0.3.0-dev.1 ->
#                      0.3.0.dev1).
# Optional:
#   PYTHON_VERSION  -- a PEP 440 version for the Python packages instead
#                      (e.g. 4.4.0 or 4.4.0.post1). Python versions only
#                      move up, so it is required whenever VERSION's PEP 440
#                      form is below the current Python version
#                      (python/pyproject.toml).
#   DOTNET_VERSION  -- a version for the Confluent.Kafka NuGet package, in
#                      semver form (e.g. 4.4.0-beta.1), written to
#                      dotnet/Directory.Build.props. Without it the .NET
#                      version stays as it is; it only moves up. To change
#                      only the .NET version, give VERSION and
#                      PYTHON_VERSION their current values.
#   BASE_BRANCH     -- the branch to bump and the PR's base; default master.
#
# The branch is bump-version/<VERSION>, plus -py<PYTHON_VERSION> and
# -dotnet<DOTNET_VERSION> when those are given; the job fails if it already
# exists on origin. Like the translation agent's jobs, it pushes and runs `gh`
# with the agent's GitHub credentials.

agent:
  machine:
    type: s1-prod-ubuntu24-04-arm64-0

blocks:
  - name: Bump version
    task:
      # No task-level env_vars: declaring VERSION, PYTHON_VERSION,
      # DOTNET_VERSION or BASE_BRANCH here would shadow the Task parameters supplied at trigger
      # time. Defaults are applied shell-side below.
      jobs:
        - name: bump-version
          commands:
            - checkout
            - |
              : "${VERSION:?VERSION must be set as a Task parameter}"
            # The parameters are free text: accept only version characters, and
            # pass them to make in the environment (below), not on its command
            # line, where make would expand a $(...) in them. The pattern tests
            # the whole value, a line break included, which grep, reading line
            # by line, would not.
            - |
              for v in "${VERSION}" "${PYTHON_VERSION:-0}" "${DOTNET_VERSION:-0}"; do
                case "$v" in
                  ''|*[!0-9A-Za-z.+!-]*)
                    echo "Refusing to bump: '$v' is not a version" >&2
                    exit 1
                    ;;
                esac
              done
            - export BASE_BRANCH="${BASE_BRANCH:-master}"
            - export BUMP_BRANCH="bump-version/${VERSION}${PYTHON_VERSION:+-py${PYTHON_VERSION}}${DOTNET_VERSION:+-dotnet${DOTNET_VERSION}}"
            - |
              if git ls-remote --exit-code --heads origin "${BUMP_BRANCH}" >/dev/null; then
                echo "Refusing to bump: ${BUMP_BRANCH} already exists on origin; close its PR and delete it first" >&2
                exit 1
              fi
            # Semaphore's shallow single-branch clone has no
            # origin/<other-branch>, so start from FETCH_HEAD.
            - git fetch origin "${BASE_BRANCH}"
            - git checkout -B "${BUMP_BRANCH}" FETCH_HEAD
            # Installs rustup, which installs the toolchain rust/rust-toolchain.toml pins.
            - ./.semaphore/dependencies.sh
            - export VERSION PYTHON_VERSION="${PYTHON_VERSION:-}" DOTNET_VERSION="${DOTNET_VERSION:-}"
            - make bump-version
            - |
              if git diff --quiet; then
                echo "Nothing to bump: ${BASE_BRANCH} already has these versions" >&2
                exit 1
              fi
            - git diff --stat
            - git config user.name >/dev/null || git config user.name "Semaphore CI"
            - git config user.email >/dev/null || git config user.email "semaphore-ci@confluent.io"
            # --no-verify: a pre-commit hook, if one is configured, would run
            # the suite here; the PR's own build runs the checks.
            - |
              PYTHON_NOTE=""
              if [ -n "${PYTHON_VERSION:-}" ]; then
                PYTHON_NOTE=" The Python packages are at ${PYTHON_VERSION}."
              fi
              DOTNET_NOTE=""
              if [ -n "${DOTNET_VERSION:-}" ]; then
                DOTNET_NOTE=" The .NET package is at ${DOTNET_VERSION}."
              fi
              git commit --no-verify -a -q -F - <<EOF
              Version ${VERSION}

              Set by the "Bump version" Semaphore Task with \`make bump-version\`.${PYTHON_NOTE}${DOTNET_NOTE}
              EOF
            - git push origin "HEAD:refs/heads/${BUMP_BRANCH}"
            - |
              {
                echo "Sets version \`${VERSION}\` with \`make bump-version\`, from the \"Bump version\" Semaphore Task."
                echo
                if [ -n "${PYTHON_VERSION:-}" ]; then
                  echo "The Python packages get \`${PYTHON_VERSION}\`, given as PYTHON_VERSION."
                else
                  echo "The Python packages get the same version in PEP 440 form."
                fi
                echo
                if [ -n "${DOTNET_VERSION:-}" ]; then
                  echo "The .NET package gets \`${DOTNET_VERSION}\`, given as DOTNET_VERSION."
                else
                  echo "The .NET package keeps its version (no DOTNET_VERSION given)."
                fi
                echo
                echo '```'
                git show --stat --format= HEAD
                echo '```'
              } > "${HOME}/pr-body.md"
            - gh pr create --base "${BASE_BRANCH}" --head "${BUMP_BRANCH}" --title "Version ${VERSION}" --body-file "${HOME}/pr-body.md"
