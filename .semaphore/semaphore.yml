version: v1.0
name: Translation agent

# Single CI pipeline that conditionally:
#  - on the configured main branch (push, not PR) -> runs the narrowed
#    sweep (closure check + cursor advance + create up to 10 new draft
#    PRs). Sweep no longer dispatches dep-eval / plan / impl -- those
#    are driven per-PR by the cascade below.
#  - on a PR build whose head branch is NOT the main branch -> runs
#    `translation-agent --pr <N>` cascade. The cascade reads the row's
#    current status and runs the next applicable step:
#      0 -> 1 (dep-eval) -> 2 (plan, stops at human gate)
#      3 -> 4 (impl, only after `--plan-approve`)
#  - on a PR build whose head branch IS the main branch -> SKIP both
#    phases. We never want a human's PR-against-main review to also
#    trigger a full sweep (which would publish new translation PRs
#    mid-review) or a per-PR cascade (the PR isn't a translation
#    PR managed by the orchestrator).
#  - otherwise -> no-op
#
# A manual promotion ("Approve plan and implement") triggers
# plan-approve.yml, which flips the PR's status from 2 (plan_created) to 3
# (plan_approved) and immediately runs the implementation step.
#
# Block layout (each Semaphore job is a fresh VM with its own checkout of the
# pipeline's SHA):
#   1. "Run translation-agent" -- the only block that needs the orchestrator's
#      Python package and the `translation_agent.db` artifact, so that setup
#      lives in this block's prologue rather than in global_job_config.
#   2. "Verification" -- `make verify` on the checked-out tree. Split out of
#      the agent job so a tree-validation failure is attributable on its own
#      job, and so its log isn't buried under the agent's output. The agent
#      works in a detached git worktree and the orchestrator pushes the
#      branch, so the main checkout is never mutated by the cascade: this
#      verifies exactly the same tree the old in-job `make verify` did.
#   3. "R2 Code Review" -- PR-only. Sequenced after the agent block so the
#      review does not race an implementation step that is still writing
#      commits to the PR under review.

agent:
  machine:
    type: s1-prod-ubuntu24-04-arm64-2

global_job_config:
  prologue:
    commands:
      - checkout
      # When the Task is triggered manually with a "Run on branch" override,
      # Semaphore exposes the desired branch as SEMAPHORE_GIT_BRANCH_CHECKOUT
      # but `checkout` still lands on the build's original ref. Switch to the
      # requested branch so submodule init + pip install operate against the
      # right tree.
      - |
        if [ -n "${SEMAPHORE_GIT_BRANCH_CHECKOUT}" ]; then
          echo "SEMAPHORE_GIT_BRANCH_CHECKOUT=${SEMAPHORE_GIT_BRANCH_CHECKOUT} -- switching working tree"
          # Semaphore's shallow single-branch clone doesn't create
          # refs/remotes/origin/<other-branch>, so origin/<branch> isn't a
          # valid start point. Use FETCH_HEAD (which the explicit fetch
          # above does update) and -B so re-runs reset an existing local
          # branch instead of failing.
          git fetch origin "${SEMAPHORE_GIT_BRANCH_CHECKOUT}"
          git checkout -B "${SEMAPHORE_GIT_BRANCH_CHECKOUT}" FETCH_HEAD
        fi
      - sem-version python 3.10

blocks:
  - name: Run translation-agent
    dependencies: []
    task:
      env_vars:
        # Override in the Semaphore project's "Environment Variables" or
        # Secrets tab to track a different mainline branch. The sweep runs
        # only when the build is for this exact branch.
        - name: MAIN_BRANCH
          value: master
        # Path to the AK repo, relative to the job's cwd -- the repo root.
        # (The prologue's `cd tools/translation_agent` is confined to a
        # subshell, so it does not move the cwd for the job commands.)
        # Defaults to the `kafka` git submodule at the repo root.
        - name: AK_REPO_PATH
          value: ./kafka
      # Only this block needs the orchestrator package and its DB artifact;
      # the Verification and R2 blocks skip both.
      prologue:
        commands:
          - artifact pull project translation_agent.db || true
      jobs:
        # `make verify` is NOT part of this job -- it runs in the
        # "Verification" block below.
        - name: "Sweep phase or PR planning or implementation (optional)"
          commands:
            - ./tools/translation_agent/translation_agent.sh

  - name: "R2 Code Review"
    # Sequenced after the agent block: on a PR at status 3 the cascade runs
    # the implementation step and pushes commits to this very PR, so a
    # concurrent review would read a half-written diff.
    dependencies: ["Run translation-agent"]
    run:
      # run on all pull requests except changes in `/.deployed-versions/`
      when: "pull_request =~ '.+' and change_in('/', {exclude: ['/.deployed-versions/']})"
    task:
      prologue:
        commands:
          - ./.semaphore/dependencies.sh || true
          - make || true
      jobs:
        - name: "R2 Code Review"
          commands:
            # || true: code review failures are unrelated to the codebase and should not block CI. Please report issues to Slack channel #r2.
            - r2 code-review --verbose --timeout=15m || true

  - name: "Verification"
    # No `run: when:` -- build/lint/test validation applies to every build
    # (main-branch pushes included), matching the unconditional `make verify`
    # this replaces.
    dependencies: ["Run translation-agent"]
    task:
      prologue:
        commands:
          - ./.semaphore/dependencies.sh
      jobs:
        - name: "make verify"
          commands:
            # Runs in the Semaphore env against the checked-out tree, as
            # opposed to the `make verify` the agent runs inside its own
            # sandboxed worktree during the implementation step.
            - make verify

promotions:
  - name: Approve plan and implement
    pipeline_file: plan-approve.yml
  - name: Ask agent
    pipeline_file: ask.yml
    parameters:
      env_vars:
        - name: USER_COMMAND
          required: true
          description: "Free-text instruction passed verbatim to a sandboxed
            claude. The agent's answer is posted as a PR comment with this
            text quoted. At status 1 the agent answers only; at 2/3/4 the
            agent may also produce git fixup commits which the orchestrator
            pushes."
