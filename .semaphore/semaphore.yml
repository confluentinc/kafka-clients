version: v1.0
name: build-test-release

# Single CI pipeline that conditionally:
#  - on the configured main branch (push, not PR) -> runs the narrowed
#    sweep (closure check + cursor advance + create up to 10 new draft
#    PRs). Sweep no longer dispatches dep-eval / plan / impl -- those
#    are driven per-PR by the cascade below.
#  - on a PR build whose head branch is NOT the main branch -> runs
#    `translation-agent --pr <N>` cascade. The cascade reads the row's
#    current status and runs the next applicable step:
#      0 -> 1 (dep-eval) -> 2 (plan, stops at human gate)
#      3 -> 4 (impl, only after `--plan-approve`)
#  - on a PR build whose head branch IS the main branch -> SKIP both
#    phases. We never want a human's PR-against-main review to also
#    trigger a full sweep (which would publish new translation PRs
#    mid-review) or a per-PR cascade (the PR isn't a translation
#    PR managed by the orchestrator).
#  - otherwise -> no-op
#
# A manual promotion ("Approve plan and implement") triggers
# plan-approve.yml, which flips the PR's status from 2 (plan_created) to 3
# (plan_approved) and immediately runs the implementation step.
#
#
# Block layout (each Semaphore job is a fresh VM with its own checkout of the
# pipeline's SHA):
#   1. "R2 Code Review" -- PR-only. Runs the r2 code-review tool.
#   2. "Verify Rust (Linux amd64)" -- format/lint plus the whole Rust test
#      suite, including the native-Rust arm of the multilanguage tests.
#   3. "Verify language bindings (Linux amd64)" -- verify-c, verify-python, and
#      verify-dotnet, including the gRPC multilanguage arm (__grpc_c /
#      __grpc_python / __grpc_dotnet). .NET has a HARD amd64
#      requirement the other two don't: Grpc.Tools ships an arm64 protoc that
#      SIGSEGVs during C# codegen, so building it needs an amd64-native agent.
#   4. "Verify Rust (macOS arm64)" -- native Rust unit + integration + perf on
#      s1-macos-15-arm64-8. dependencies-macos.sh brings up Docker via Colima
#      for the broker the integration/perf tests need.
#   5. "Build + unit test bindings (macOS)" -- verify-c (ctest), verify-python
#      (pytest test/unit), and verify-dotnet (dotnet test, net8.0 + net10.0).
#      No container is used, so the block sets MACOS_SKIP_COLIMA=true and
#      dependencies-macos.sh skips Colima.
#
# All blocks declare `dependencies: []`, so every job starts immediately
# and runs in parallel. Each rebuilds the Rust library it needs. Sharing one
# build between blocks via a workflow artifact was tried and reverted: the
# tarball reached 8.9 GiB, so the transfer cost more than the builds it saved.
#
# Split per language so a failure is attributable to one job, and so the gRPC
# arm of the multilanguage suite runs in the job for the binding it exercises
# (see the `__grpc_` naming convention in tests/common/multilanguage_test_macro.rs).
#
# The translation agent is a separate manual promotion (start-translation-plan.yml).
# It runs in a detached git worktree and pushes new commits when promotions
# run either manually or automatically.
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-2

global_job_config:
  prologue:
    commands:
      - checkout
      # When the Task is triggered manually with a "Run on branch" override,
      # Semaphore exposes the desired branch as SEMAPHORE_GIT_BRANCH_CHECKOUT
      # but `checkout` still lands on the build's original ref. Switch to the
      # requested branch so submodule init + pip install operate against the
      # right tree.
      - |
        if [ -n "${SEMAPHORE_GIT_BRANCH_CHECKOUT}" ]; then
          echo "SEMAPHORE_GIT_BRANCH_CHECKOUT=${SEMAPHORE_GIT_BRANCH_CHECKOUT} -- switching working tree"
          # Semaphore's shallow single-branch clone doesn't create
          # refs/remotes/origin/<other-branch>, so origin/<branch> isn't a
          # valid start point. Use FETCH_HEAD (which the explicit fetch
          # above does update) and -B so re-runs reset an existing local
          # branch instead of failing.
          git fetch origin "${SEMAPHORE_GIT_BRANCH_CHECKOUT}"
          git checkout -B "${SEMAPHORE_GIT_BRANCH_CHECKOUT}" FETCH_HEAD
        fi
      - sem-version python 3.10

blocks:
  - name: "R2 Code Review"
    # The translation agent (start-translation-plan.yml) is a separate
    # promotion pipeline, so there is no sequencing concern here.
    dependencies: []
    run:
      # run on all pull requests except changes in `/.deployed-versions/`
      when: "pull_request =~ '.+' and change_in('/', {exclude: ['/.deployed-versions/']})"
    task:
      prologue:
        commands:
          - ./.semaphore/dependencies.sh || true
          - make || true
      jobs:
        - name: "R2 Code Review"
          commands:
            # || true: code review failures are unrelated to the codebase and should not block CI. Please report issues to Slack channel #r2.
            - r2 code-review --verbose --timeout=15m || true

  - name: "Verify Rust (Linux amd64)"
    # Verification that happens on every new commit, whether created manually
    # or by the translation agent. The agent runs in a detached worktree and
    # pushes new commits when promotions run either manually or automatically.
    dependencies: []
    task:
      prologue:
        commands:
          - ./.semaphore/dependencies.sh
      jobs:
        - name: "verify-rust (Linux amd64)"
          commands:
            - make verify-rust

  - name: "Verify language bindings (Linux amd64)"
    # `dependencies: []` so this starts alongside "Verify Rust" rather than
    # after it. Each job builds the Rust library itself; sharing one build via
    # a workflow artifact was tried and reverted -- the tarball came to 8.9 GiB
    # (target/debug is ~12x target/release, and ~48% of it is rustc incremental
    # caches that CI never reuses), so pushing it once and pulling it twice cost
    # more than the builds it replaced.
    dependencies: []
    task:
      prologue:
        # Runs before EACH job in this block; verify-c / verify-python /
        # verify-dotnet are separate VMs with their own checkout.
        commands:
          - ./.semaphore/dependencies.sh
      jobs:
        - name: "verify-c (Linux amd64)"
          commands:
            - make verify-c
        - name: "verify-python (Linux amd64)"
          commands:
            - make verify-python
        - name: "verify-dotnet (Linux amd64)"
          commands:
            - ./.semaphore/install-dotnet.sh
            - export DOTNET_ROOT="$HOME/.dotnet"
            - export PATH="$HOME/.dotnet:$PATH"
            - export DOTNET_MULTILEVEL_LOOKUP=0
            - which dotnet
            - dotnet --list-runtimes
            - make verify-dotnet

  - name: "Verify Rust (macOS arm64)"
    dependencies: []
    task:
      agent:
        machine:
          type: s1-macos-15-arm64-8
      env_vars:
        - name: RUST_BACKTRACE
          value: full
      prologue:
        commands:
          - source ./.semaphore/dependencies-macos.sh
      epilogue:
        always:
          commands:
            - colima stop || true
      jobs:
        - name: "verify-rust (macOS arm64)"
          commands:
            - make verify-rust-macos-docker

  - name: "Build + unit test bindings (macOS)"
    # verify-c runs the C ctest suite; verify-python runs pytest test/unit;
    # verify-dotnet runs dotnet test on net8.0 + net10.0. No container is
    # used, so MACOS_SKIP_COLIMA=true tells dependencies-macos.sh to skip
    # Colima. The gRPC multilanguage arm runs on Linux only.
    dependencies: []
    task:
      agent:
        machine:
          type: s1-macos-15-arm64-8
      env_vars:
        - name: RUST_BACKTRACE
          value: full
        - name: MACOS_SKIP_COLIMA
          value: "true"
      prologue:
        commands:
          - source ./.semaphore/dependencies-macos.sh
      jobs:
        - name: "verify-c (macOS arm64)"
          commands:
            - make verify-c-macos-docker
        - name: "verify-python (macOS arm64)"
          commands:
            - make verify-python-macos-docker
        - name: "verify-dotnet (macOS arm64)"
          commands:
            - ./.semaphore/install-dotnet.sh
            - export DOTNET_ROOT="$HOME/.dotnet"
            - export PATH="$HOME/.dotnet:$PATH"
            - export DOTNET_MULTILEVEL_LOOKUP=0
            - which dotnet
            - dotnet --list-runtimes
            - make verify-dotnet-macos-docker

promotions:
  - name: Start translation plan
    pipeline_file: start-translation-plan.yml
  - name: Approve plan and implement
    pipeline_file: plan-approve.yml
  - name: Ask agent
    pipeline_file: ask.yml
    parameters:
      env_vars:
        - name: USER_COMMAND
          required: true
          description: "Free-text instruction passed verbatim to a sandboxed
            claude. The agent's answer is posted as a PR comment with this
            text quoted. At status 1 the agent answers only; at 2/3/4 the
            agent may also produce git fixup commits which the orchestrator
            pushes."
