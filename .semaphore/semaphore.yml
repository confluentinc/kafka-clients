version: v1.0
name: build-test-release

# Single CI pipeline that conditionally:
#  - on the configured main branch (push, not PR) -> runs the narrowed
#    sweep (closure check + cursor advance + create up to 10 new draft
#    PRs). Sweep no longer dispatches dep-eval / plan / impl -- those
#    are driven per-PR by the cascade below.
#  - on a PR build whose head branch is NOT the main branch -> runs
#    `translation-agent --pr <N>` cascade. The cascade reads the row's
#    current status and runs the next applicable step:
#      0 -> 1 (dep-eval) -> 2 (plan, stops at human gate)
#      3 -> 4 (impl, only after `--plan-approve`)
#  - on a PR build whose head branch IS the main branch -> SKIP both
#    phases. We never want a human's PR-against-main review to also
#    trigger a full sweep (which would publish new translation PRs
#    mid-review) or a per-PR cascade (the PR isn't a translation
#    PR managed by the orchestrator).
#  - otherwise -> no-op
#
# A manual promotion ("Approve plan and implement") triggers
# plan-approve.yml, which flips the PR's status from 2 (plan_created) to 3
# (plan_approved) and immediately runs the implementation step.
#
#
# Block layout (each Semaphore job is a fresh VM with its own checkout of the
# pipeline's SHA):
#   1. "Verify Rust and language bindings (Linux amd64)" -- the whole Rust
#      test suite, including the native-Rust arm of the multilanguage tests,
#      and verify-c, verify-python and verify-dotnet, each over PLAINTEXT, SSL
#      and SASL_SSL, including the gRPC multilanguage arm (__grpc_c /
#      __grpc_python / __grpc_dotnet). The .NET gRPC images are built for
#      linux/amd64: Grpc.Tools' linux_arm64 protoc SIGSEGVs during C# codegen
#      inside an arm64 Linux container, so they need an amd64 Linux agent
#      (which this block uses anyway).
#   2. "Verify Rust and language bindings (macOS arm64)" -- native Rust unit +
#      integration + perf on s1-macos-15-arm64-8, and verify-c (ctest),
#      verify-python (pytest test/unit) and verify-dotnet (dotnet test, net8.0 +
#      net10.0), each followed by the gRPC multilanguage arm with the gRPC
#      server running as a native host process (MULTILANG_BACKEND_MODE=native),
#      which tests the macOS build of each binding. dependencies-macos.sh brings
#      up Docker via Colima for the broker. The native .NET server is the
#      net10.0 build; Grpc.Tools has no macOS arm64 protoc and runs its
#      macosx_x64 one under Rosetta 2, which is unaffected by the linux_arm64
#      SIGSEGV in item 1.
#   3. "Rust additional checks (Linux amd64)" -- one job each: the rustdoc of
#      every workspace crate with warnings denied, plus clippy over the default
#      features (doc-check); format-check, check-generated, the custom lint
#      rules and clippy over --all-features (lint); the packaged crate's
#      contents (package-check); the Rust API and the C ABI against the last
#      release tag, where a breaking change fails unless the Cargo.toml version
#      allows it (api-compat); rust/Cargo.lock against the RustSec advisory
#      database, where a vulnerable dependency fails (audit).
#   On a release tag, the "Release" promotion then starts release.yml, which
#   holds the "Release (Rust):", "Release (Python):" and "Release (.NET):"
#   blocks (see the comments there).
#
# On a pull request build the Linux and macOS verify blocks run only the tests
# that a selection in the committed test-selection/ folder selects (`make
# select-tests`, or the pre-push hook, which commits one for a pushed HEAD), the
# one made for the pull request's head (SEMAPHORE_GIT_PR_SHA: the checkout is
# that head merged with master, whose own changes master's builds verified);
# every other build, and a pull request without a matching selection, runs
# every test. The Windows block's script, which does not go through the
# Makefiles, applies the selection's dotnet.solution section to the .NET unit
# tests through xtask's test-selection binary.
#
# Each verify block sets execution_time_limit to about twice its typical job
# duration, so a hung test fails the job early instead of running until the
# pipeline's default limit. Semaphore rejects the whole pipeline when it
# compiles it if a job's limit is longer than its block's, or a block's or
# job's is longer than the pipeline's (3 hours, the explicit
# execution_time_limit below; Semaphore's default is 1 hour). The pipeline then
# fails with no blocks run. So a job that needs more time than its block must
# move to a block of its own; a longer job-level limit is not enough.
#
# All CI blocks declare `dependencies: []`, so every job starts immediately
# and runs in parallel. Each rebuilds the Rust library it needs. Sharing one
# build between blocks via a workflow artifact was tried and reverted: the
# tarball reached 8.9 GiB, so the transfer cost more than the builds it saved.
#
# Split per language so a failure is attributable to one job, and so the gRPC
# arm of the multilanguage suite runs in the job for the binding it exercises
# (see the `__grpc_` naming convention in rust/tests/common/multilanguage_test_macro.rs).
#
# The translation agent is a separate manual promotion (start-translation-plan.yml).
# It runs in a detached git worktree and pushes new commits when promotions
# run either manually or automatically.
#
# Releases are driven by git tags, one per package:
#   - rust/v<version> publishes the confluent-kafka crate to crates.io. The
#     version is [package] version in rust/Cargo.toml, and may carry an
#     -alpha.N, -beta.N, -rc.N or -dev.N suffix.
#   - python/v<version> publishes the confluent-kafka wheels. The version is
#     [project] version in python/pyproject.toml, and may carry an aN, bN or
#     rcN suffix, optionally followed by .devN, or a .devN suffix alone. The
#     tag build builds and tests the wheels but publishes nothing. Every
#     version goes to Test PyPI first, through the manual "Publish to Test
#     PyPI" promotion of the tag build, and is checked there; it then goes to
#     PyPI through the manual "Publish to PyPI" promotion of that Test PyPI
#     pipeline. This holds for a pre-release (an aN, bN or rcN suffix) and a
#     dev version (a .devN suffix, python/v4.4.0a1.dev1) too: both publishes
#     are manual, so a version reaches an index only when someone promotes it.
#     The PyPI project is shared with confluent-kafka-python, the
#     librdkafka-based client.
#   - dotnet/v<version> releases the Confluent.Kafka NuGet package. The
#     version is <Version> in dotnet/Directory.Build.props, and may carry an
#     -alpha.N, -beta.N, -rc.N or -dev.N suffix; an -alpha.N, -beta.N or
#     -rc.N one may be followed by .dev.M, a dev build. NuGet puts a dev
#     build after the version it extends (4.4.0-alpha.1 <
#     4.4.0-alpha.1.dev.1 < 4.4.0-alpha.2), so the dev builds that lead up
#     to 4.4.0-alpha.1 are 4.4.0-alpha.0.dev.M. The tag build builds and
#     tests the package and records it in the workflow's artifacts, but
#     publishes nothing: it is uploaded to nuget.org by hand. The id is shared
#     with confluent-kafka-dotnet, the librdkafka-based client, whose versions
#     are 2.x.
#   - A Rust dev version (rust/v0.2.0-dev.1) publishes nothing. Its tag build
#     runs CI and the blocks that package and test the crate (recorded in the
#     workflow's artifacts), and skips every publish block.
# To release a package:
#   1. Merge the change that sets its version to master, or, for a patch or
#      pre-release of an earlier line of the crate, to its release branch
#      <major>.<minor>.x (1.0.x), where the fixes are backported. The wheels
#      and the NuGet package are released only from master.
#   2. On the build of that commit, run the manual "Create release tag"
#      promotion (create-release-tag.yml) and enter the version of each client
#      to release, RUST_VERSION, PYTHON_VERSION and DOTNET_VERSION; a client
#      left empty is not released. It refuses unless every version entered
#      matches its manifest and is new, and every CI job passed on that build,
#      then pushes one tag per client entered, rust/v<version>,
#      python/v<version> and dotnet/v<version>.
#   3. Each tag push runs this pipeline on that tag. CI runs again, and when it
#      has finished, passed or failed, the automatic "Release" promotion starts
#      release.yml, the release blocks of that client: CI already passed on the
#      commit before the tag was created, and a flaky test or an unavailable
#      external resource on the tag build must not block the release. The
#      crate is published to crates.io; the wheels and the NuGet package are
#      built, tested and packaged, and recorded in the workflow's artifacts.
#   4. For the wheels, run the manual "Publish to Test PyPI" promotion
#      (publish-testpypi.yml) on that release pipeline once its packaging
#      block has passed. It publishes them to Test PyPI and checks them there.
#   5. For a final Python version, run the manual "Publish to PyPI" promotion
#      (publish-pypi.yml) on that Test PyPI pipeline once its blocks have
#      passed.
#   6. For the NuGet package, once the packaging block of that release
#      pipeline has passed, download nuget/release/Confluent.Kafka.<version>.nupkg from the
#      workflow's artifacts and upload it to nuget.org by hand. Before the
#      upload, compare its SHA-256 with the one the "Package the tested
#      package" job printed in its log, which no later job can change.
# A release tag pushed by other means follows the same path from step 3. The
# "Release" promotion starts only on a release tag, and the Python promotions
# publish nothing on any other build, so the crate is the only package
# published without a manual step.
#
# CI results: every job records its result and the commit it tested as
# `ci-result/<job name>` in the workflow's artifacts, `running` when it starts
# (.semaphore/job-start.sh, job-start.ps1), then `passed` or `failed` in its
# block's epilogue (.semaphore/ci-result.sh on Linux and macOS, ci-result.ps1
# on Windows). Because each write replaces the previous one, only the latest
# run of a job counts. The commit is the working tree's HEAD rather than
# SEMAPHORE_GIT_SHA, so a job that switched branches (see job-start.sh) cannot
# attest to the commit being tagged. A new block must have the epilogue: a job
# without it stays recorded as running, which create-release-tag.yml refuses. "Create release tag" refuses unless every job in its REQUIRED_CI_JOBS
# list passed on the commit and no other job reported a result, so adding,
# renaming or removing a CI job here also means updating that list.
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-2

# The limit is explicit so that it does not depend on Semaphore's default for a
# pipeline (1 hour).
execution_time_limit:
  hours: 3

global_job_config:
  env_vars:
    # The crate that the "Release (Rust):" blocks publish.
    - name: CRATE
      value: confluent-kafka
    # The PyPI project that the "Release (Python):" blocks publish: [project]
    # name in python/pyproject.toml.
    - name: PYPI_PACKAGE
      value: confluent-kafka
    # The NuGet package that the "Release (.NET):" blocks publish: <PackageId>
    # in dotnet/src/Confluent.Kafka/Confluent.Kafka.csproj.
    - name: NUGET_PACKAGE
      value: Confluent.Kafka
  # Shell-neutral, because the Windows blocks run it too and their shell is PowerShell. Each
  # block's task prologue starts with the rest for its shell: `. .semaphore/job-start.sh` on Linux
  # and macOS (the "Run on branch" switch, the `running` result of "CI results" in the header,
  # and Python 3.10), `.semaphore/job-start.ps1` on Windows. A new block must start its prologue
  # with one of them.
  prologue:
    commands:
      - checkout
  # No global epilogue: its commands would run in the Windows agents' PowerShell
  # too, which cannot parse bash. Each block records its jobs' CI results in its
  # own epilogue (see "CI results" in the header).

blocks:
  - name: "Verify Rust and language bindings (Linux amd64)"
    # Runs on every new commit, whether created manually or by the translation
    # agent. Each job is a separate VM with its own broker, so the jobs run in
    # parallel and do not contend for Docker resources. See
    # rust/tests/common/test_context.rs (INTEGRATION_TEST_PROTOCOL /
    # TestProtocol) for how a cluster's four listeners are selected per run.
    #
    # The three Rust jobs run the whole native-Rust test suite (unit tests +
    # the functional integration suite + the `__rust` multilanguage arms); they
    # differ only in which broker listener the clients connect over:
    #   - PLAINTEXT: the suite over the default PLAINTEXT listener, plus the
    #     performance tests, which run only here.
    #   - SSL / SASL_SSL: the same suite over the broker's SSL listener (:9096)
    #     or its SASL_SSL listener (:9097, SASL/PLAIN, admin / admin-secret).
    # The protocol-independent checks of `make verify-rust` (format-check,
    # check-generated, lint) run in the lint and doc-check jobs of "Rust
    # additional checks (Linux amd64)", in parallel, so no test job waits for
    # them.
    #
    # Each binding runs across the same three protocols. Its jobs build the
    # Rust library themselves, the debug all-features build the Rust tests use
    # (the root's devel-build-rust-all-features), which the Python and .NET
    # perf stages of the plaintext jobs reuse: like the Rust perf tests, they
    # are latency smoke runs at 100 records/s with a p99 budget. Sharing one build via a workflow artifact was tried and
    # reverted -- the tarball came to 8.9 GiB (target/debug is ~12x
    # target/release, and ~48% of it is rustc incremental caches that CI never
    # reuses), so pushing it once and pulling it twice cost more than the
    # builds it replaced. The gRPC multilanguage container arm (__grpc_c /
    # __grpc_python / __grpc_dotnet) connects to the broker over the CONTAINER
    # listener for the active protocol:
    #   - PLAINTEXT: `make verify-c` / `make verify-python` / `make verify-dotnet`
    #     — the full binding gate (ctest / pytest / dotnet test unit tests, the
    #     PLAINTEXT gRPC arm, check-bindings, and the Python and .NET perf
    #     suites).
    #   - SSL / SASL_SSL: only the gRPC container arm re-run over the SSL
    #     (CTLSONLY :9100) or SASL_SSL (CSASLTLS :9101) CONTAINER listener. The
    #     unit tests, check-bindings and perf are protocol-independent, so
    #     running them once in the PLAINTEXT job is enough. The .NET protocol
    #     jobs install no host .NET: the gRPC images build inside the .NET SDK
    #     image, and the harness is Rust.
    #
    # The block's 45 minutes is the Rust jobs' limit; each binding job sets 30
    # minutes of its own (a job's limit may not exceed its block's, see the
    # note at the top of this file). verify-dotnet's plaintext job is the
    # longest binding job: 26 minutes on 2026-09-30 and 20 on 2026-10-01,
    # against about 11 for verify-c and verify-python. If it starts timing
    # out, raise its own limit, up to the block's.
    dependencies: []
    execution_time_limit:
      minutes: 45
    task:
      prologue:
        # Runs before EACH job in this block; every job is a separate VM with
        # its own checkout.
        commands:
          - . .semaphore/job-start.sh
          # On a pull request, only the tests that the selection in the
          # committed test-selection/ folder made for exactly this working
          # tree selects (`make select-tests`, see
          # rust/xtask/src/test_selection.rs); otherwise every test runs.
          - if [ -n "${SEMAPHORE_GIT_PR_NUMBER:-}" ]; then export TEST_SELECTION=test-selection; fi
          - ./.semaphore/dependencies.sh
          # What the selection runs and why, at the top of the job's own log.
          - (cd rust && cargo -q xtask show-test-selection)
      epilogue:
        on_pass:
          commands:
            - .semaphore/ci-result.sh passed
        on_fail:
          commands:
            - .semaphore/ci-result.sh failed
      jobs:
        - name: "verify-rust (Linux amd64) — plaintext"
          commands:
            - make test-rust-all-features
            - make test-integration-perf-rust
        - name: "verify-rust (Linux amd64) — ssl"
          commands:
            - make test-rust-all-features-ssl
        - name: "verify-rust (Linux amd64) — sasl_ssl (plain)"
          commands:
            - make test-rust-all-features-sasl-ssl
        - name: "verify-c (Linux amd64) — plaintext"
          execution_time_limit:
            minutes: 30
          commands:
            - make verify-c
        - name: "verify-c (Linux amd64) — ssl"
          execution_time_limit:
            minutes: 30
          commands:
            - make test-integration-c-ssl
        - name: "verify-c (Linux amd64) — sasl_ssl (plain)"
          execution_time_limit:
            minutes: 30
          commands:
            - make test-integration-c-sasl-ssl
        - name: "verify-python (Linux amd64) — plaintext"
          execution_time_limit:
            minutes: 30
          commands:
            - make verify-python
        - name: "verify-python (Linux amd64) — ssl"
          execution_time_limit:
            minutes: 30
          commands:
            - make test-integration-python-ssl
        - name: "verify-python (Linux amd64) — sasl_ssl (plain)"
          execution_time_limit:
            minutes: 30
          commands:
            - make test-integration-python-sasl-ssl
        - name: "verify-dotnet (Linux amd64) — plaintext"
          execution_time_limit:
            minutes: 30
          commands:
            - ./.semaphore/install-dotnet.sh
            - export DOTNET_ROOT="$HOME/.dotnet"
            - export PATH="$HOME/.dotnet:$PATH"
            - export DOTNET_MULTILEVEL_LOOKUP=0
            - which dotnet
            - dotnet --list-runtimes
            - make verify-dotnet
        - name: "verify-dotnet (Linux amd64) — ssl"
          execution_time_limit:
            minutes: 30
          commands:
            - make test-integration-dotnet-ssl
        - name: "verify-dotnet (Linux amd64) — sasl_ssl (plain)"
          execution_time_limit:
            minutes: 30
          commands:
            - make test-integration-dotnet-sasl-ssl

  - name: "Verify Rust and language bindings (macOS arm64)"
    # verify-rust runs the native Rust unit, integration and perf tests
    # (`make verify-rust-macos-docker`). verify-c runs the C ctest suite;
    # verify-python runs pytest test/unit; verify-dotnet runs the .NET unit
    # tests. Each binding job then runs its binding's gRPC multilanguage arm
    # (__grpc_c / __grpc_python / __grpc_dotnet) with the gRPC server as a
    # native host process rather than a container. Containers on macOS run
    # Linux, so a container would only test the Linux build of the binding.
    # The broker runs in Docker via Colima. The verify-dotnet job sets
    # MACOS_ENSURE_ROSETTA, because building the native .NET server runs
    # Grpc.Tools' macosx_x64 protoc under Rosetta 2. It also packs the NuGet
    # package with this machine's native library and installs it into a fresh
    # project (make package-check-dotnet), which needs no Docker.
    #
    # The binding jobs use PLAINTEXT only. The SSL and SASL_SSL variants of
    # their arm run on Linux. The TLS and SASL code paths are in the Rust
    # client and are covered on macOS by rust/src/integration_tests/ssl_sasl_test.rs
    # and rust/tests/integration/sasl_ssl_consumer_test.rs in the verify-rust job.
    #
    # The block's 45 minutes is the verify-rust job's limit; each binding job
    # sets 30 minutes of its own (a job's limit may not exceed its block's).
    # verify-dotnet took 10 minutes on 2026-10-01, before the package check,
    # which takes about a minute.
    dependencies: []
    execution_time_limit:
      minutes: 45
    task:
      agent:
        machine:
          type: s1-macos-15-arm64-8
      env_vars:
        - name: RUST_BACKTRACE
          value: full
      prologue:
        commands:
          - . .semaphore/job-start.sh
          # The test selection, as in "Verify Rust and language bindings (Linux amd64)".
          - if [ -n "${SEMAPHORE_GIT_PR_NUMBER:-}" ]; then export TEST_SELECTION=test-selection; fi
          - source ./.semaphore/dependencies-macos.sh
          # What the selection runs and why, at the top of the job's own log.
          - (cd rust && cargo -q xtask show-test-selection)
      epilogue:
        always:
          commands:
            - colima stop || true
            # Temporary, with CONFLUENT_KAFKA_DOTNET_HANG_DIR below: uploads the native stacks a .NET test sampled
            # when its TestTimeout bound expired. The folder exists only after such a timeout.
            - 'if [ -d /tmp/confluent-kafka-dotnet-hangs ]; then artifact push job --expire-in 2w /tmp/confluent-kafka-dotnet-hangs || true; fi'
        on_pass:
          commands:
            - .semaphore/ci-result.sh passed
        on_fail:
          commands:
            - .semaphore/ci-result.sh failed
      jobs:
        - name: "verify-rust (macOS arm64)"
          commands:
            # The submodule is a shallow clone; `lint-custom` reads the
            # Kafka tags pinned in xtask and fails without them.
            - (cd rust && cargo xtask fetch-java-refs)
            - make verify-rust-macos-docker
        - name: "verify-c (macOS arm64)"
          execution_time_limit:
            minutes: 30
          env_vars:
            # Installs gRPC C++, protobuf and pkg-config for the native C++ server.
            - name: MACOS_INSTALL_GRPC_CPP
              value: "true"
          commands:
            - make verify-c-macos-docker
        - name: "verify-python (macOS arm64)"
          execution_time_limit:
            minutes: 30
          commands:
            - make verify-python-macos-docker
        - name: "verify-dotnet (macOS arm64)"
          execution_time_limit:
            minutes: 30
          env_vars:
            # Installs Rosetta 2 if it is missing, for Grpc.Tools' macosx_x64 protoc.
            - name: MACOS_ENSURE_ROSETTA
              value: "true"
            # The .NET unit and soak tests need no Docker, so the prologue skips Colima and the job
            # starts it after them: its 6-CPU, 12 GB VM then does not share the agent with the unit
            # tests. The commands below are dependencies-macos.sh's Colima bring-up.
            - name: MACOS_SKIP_COLIMA
              value: "true"
            # Temporary, until the cause of the macOS teardown stalls is found: a .NET unit test whose TestTimeout
            # bound expires samples the process's native stacks into this folder (TestTimeout.NativeStacks), and the
            # block's epilogue uploads it as a job artifact.
            - name: CONFLUENT_KAFKA_DOTNET_HANG_DIR
              value: /tmp/confluent-kafka-dotnet-hangs
          commands:
            - ./.semaphore/install-dotnet.sh
            - export DOTNET_ROOT="$HOME/.dotnet"
            - export PATH="$HOME/.dotnet:$PATH"
            - export DOTNET_MULTILEVEL_LOOKUP=0
            - which dotnet
            - dotnet --list-runtimes
            - make test-dotnet-macos-docker
            # The release blocks test the release package; this checks, on every build, that the
            # package can be packed and installed. Set on make's command line for the reason given
            # below.
            - export DOTNET_ROOT="$HOME/.dotnet" PATH="$HOME/.dotnet:$PATH" DOTNET_MULTILEVEL_LOOKUP=0 && make package-check-dotnet
            - command -v colima >/dev/null 2>&1 || brew install colima
            - colima status &>/dev/null || colima start --cpu 6 --memory 12 --disk 50
            - 'docker_wait=90; until docker info >/dev/null 2>&1; do if [ "$docker_wait" -le 0 ]; then echo "ERROR: Docker failed to start within 90 seconds"; colima status || true; exit 1; fi; sleep 3; docker_wait=$((docker_wait - 3)); done'
            - export DOCKER_HOST="unix://${HOME}/.colima/default/docker.sock"
            - export TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock
            - export TESTCONTAINERS_RYUK_DISABLED=false
            # The agent's mise shell hook can reset DOTNET_ROOT and PATH to mise's .NET 9 between
            # commands (it did after the Colima bring-up), so the .NET 10 environment is set again
            # on the make's own command line.
            - export DOTNET_ROOT="$HOME/.dotnet" PATH="$HOME/.dotnet:$PATH" DOTNET_MULTILEVEL_LOOKUP=0 && which dotnet && make test-integration-dotnet-native

  - name: "Verify language bindings (Windows amd64)"
    # The .NET client on Windows, whose package carries a win-x64 and a win-x86
    # library: each job builds the library of its platform, then runs
    # the .NET unit tests, which drive the mock clients, on net462, net8.0 and
    # net10.0 in a process of that platform
    # (.semaphore/verify-dotnet-windows.ps1), only those the test selection
    # selects on a pull request, as in the other blocks. The broker-backed tests and the
    # multilanguage arms run on Linux and macOS only: they need Linux
    # containers, which the Windows agents do not run. The agent's shell is
    # PowerShell, so the block starts with job-start.ps1 and records its result
    # in its own epilogue (see the global prologue and epilogue).
    dependencies: []
    task:
      agent:
        machine:
          type: s1-prod-windows
      prologue:
        commands:
          - .\.semaphore\job-start.ps1
      epilogue:
        on_pass:
          commands:
            - .\.semaphore\ci-result.ps1 passed
        on_fail:
          commands:
            - .\.semaphore\ci-result.ps1 failed
      jobs:
        - name: "verify-dotnet (Windows amd64)"
          commands:
            - .\.semaphore\verify-dotnet-windows.ps1 -Platform x64
        - name: "verify-dotnet (Windows x86)"
          commands:
            - .\.semaphore\verify-dotnet-windows.ps1 -Platform x86

  - name: "Rust additional checks (Linux amd64)"
    # The Rust checks that are not the test suite, one job each on its own VM,
    # in parallel with each other and with the test jobs, so a failure is
    # attributable at a glance and no test job waits for them. The block sets
    # no execution_time_limit, so it has the pipeline's; the jobs that need a
    # tighter one set their own.
    #
    #   - doc-check: `make doc-check` runs `cargo doc` with `-D warnings` over
    #     the whole workspace (the doctests already run in "Verify Rust and language bindings" as part
    #     of `cargo test`), then the clippy pass over the default features,
    #     which the lint job leaves out of its lint (LINT_ARGS) so the two
    #     clippy passes run in parallel.
    #   - lint: the protocol-independent checks of `make verify-rust`:
    #     format-check, check-generated, and `cargo xtask lint` (the custom
    #     lint rules and the clippy pass over --all-features).
    #   - package-check: packages `confluent-kafka` as it would be published
    #     and fails if the `.crate` is missing LICENSE or README.md, contains a
    #     key or certificate file, or exceeds 3 MiB compressed. It then builds a
    #     new project that depends on it (`cargo xtask package-check`).
    #   - api-compat: compares the public surface with the last release tag
    #     (`cargo xtask api-compat`): the Rust API as crates.io publishes it
    #     with cargo-semver-checks, the C ABI of the `ffi` shared library with
    #     libabigail's abidiff. A breaking change fails the job unless the
    #     version in rust/Cargo.toml allows it over the tag's: a major bump, or
    #     a minor bump while the major version is 0. So the job stays red after
    #     a breaking change until the version is bumped (from 0.1.x, to 0.2.0).
    #     The baseline is the highest release tag, rust/X.Y.Z or (for the
    #     releases before those tags) vX.Y.Z, not above the Cargo.toml version;
    #     set API_COMPAT_BASELINE to compare with another tag. `checkout` is a
    #     shallow clone without tags, hence the fetch.
    #   - audit: checks rust/Cargo.lock, which covers every crate of the
    #     workspace and so every Rust crate the library, the C library and the
    #     wheels link, against the RustSec advisory database (`make audit`,
    #     cargo-audit). A vulnerable dependency fails the job and with it the
    #     pipeline; an unmaintained, unsound or yanked crate is only reported.
    #     cargo-audit fetches the database on each run, so a newly published
    #     advisory turns the job red without any change in this repository:
    #     update the dependency, or, when it does not affect this client,
    #     ignore the advisory by id in rust/.cargo/audit.toml with the reason.
    #
    # The job names are the ones create-release-tag.yml requires.
    dependencies: []
    task:
      prologue:
        commands:
          - . .semaphore/job-start.sh
          - ./.semaphore/dependencies.sh
      epilogue:
        on_pass:
          commands:
            - .semaphore/ci-result.sh passed
        on_fail:
          commands:
            - .semaphore/ci-result.sh failed
      jobs:
        - name: "doc-check (Linux amd64)"
          commands:
            - make doc-check
            - make clippy-default-features
        - name: "lint (Linux amd64)"
          execution_time_limit:
            minutes: 20
          commands:
            # The submodule is a shallow clone; `lint-custom` reads the
            # Kafka tags pinned in xtask and fails without them.
            - (cd rust && cargo xtask fetch-java-refs)
            - make format-check
            - make check-generated
            - make lint LINT_ARGS=--without-default-features-clippy
        - name: "package-check (Linux amd64)"
          commands:
            - make package-check
        - name: "api-compat (Linux amd64)"
          execution_time_limit:
            minutes: 40
          commands:
            - sudo apt install -y abigail-tools
            # The prebuilt release, pinned by version and checksum.
            - retry curl -sSfL -o /tmp/cargo-semver-checks.tar.gz https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.51.0/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz
            - echo "cacadafaa5cd27ae6d05a74a103266917ebab4c5e43c898360e177d4fbf06a65  /tmp/cargo-semver-checks.tar.gz" | sha256sum -c -
            - mkdir -p "$HOME/.cargo/bin" && tar -xzf /tmp/cargo-semver-checks.tar.gz -C "$HOME/.cargo/bin"
            - export PATH="$HOME/.cargo/bin:$PATH"
            - git fetch --depth=1 --force origin 'refs/tags/v*:refs/tags/v*' 'refs/tags/rust/*:refs/tags/rust/*'
            - make check-api-compat
        - name: "audit (Linux amd64)"
          execution_time_limit:
            minutes: 15
          commands:
            # The prebuilt release, pinned by version and checksum.
            - retry curl -sSfL -o /tmp/cargo-audit.tgz https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
            - echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  /tmp/cargo-audit.tgz" | sha256sum -c -
            - mkdir -p "$HOME/.cargo/bin" && tar -xzf /tmp/cargo-audit.tgz -C "$HOME/.cargo/bin" --strip-components=1 cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
            - export PATH="$HOME/.cargo/bin:$PATH"
            - make audit

promotions:
  - name: Start translation plan
    pipeline_file: start-translation-plan.yml
  - name: Approve plan and implement
    pipeline_file: plan-approve.yml
  # Manual. Tags the commit of this master build as rust/v<RUST_VERSION>,
  # python/v<PYTHON_VERSION> and dotnet/v<DOTNET_VERSION>, which starts the
  # release of each client (see the header and the release blocks). A client
  # left empty is not released. Each version serves as a typed confirmation:
  # unless every version entered equals its client's version at this commit,
  # no tag is created.
  - name: Create release tag
    pipeline_file: create-release-tag.yml
    parameters:
      env_vars:
        - name: RUST_VERSION
          required: false
          description: "The version of the confluent-kafka crate to publish to
            crates.io: [package] version in rust/Cargo.toml at this commit
            (for example 4.4.0 or 4.4.0-rc.1). Leave empty to not release
            the crate."
        - name: PYTHON_VERSION
          required: false
          description: "The version of the confluent-kafka wheels to publish:
            [project] version in python/pyproject.toml at this commit (for
            example 4.4.0 or 4.4.0rc1). The tag build builds and tests the
            wheels; its \"Publish to Test PyPI\" promotion publishes them to
            Test PyPI, and that pipeline's \"Publish to PyPI\" promotion then
            to PyPI. Leave empty to not release the wheels."
        - name: DOTNET_VERSION
          required: false
          description: "The version of the Confluent.Kafka NuGet package to
            release: <Version> in dotnet/Directory.Build.props at this commit
            (for example 4.4.0 or 4.4.0-rc.1). The tag build builds and tests
            the package and records it in its artifacts, from which it is
            uploaded to nuget.org by hand. Leave empty to not release the
            package."
  # Automatic, on a release tag: starts the release pipeline (release.yml)
  # once CI has finished, whether it passed or failed. CI passed on the commit
  # before "Create release tag" pushed the tag, so a flaky test or an
  # unavailable external resource on the tag build must not block the
  # release. A stopped or canceled CI pipeline starts no release. The tag
  # patterns are the release blocks' own (see release.yml), joined.
  - name: Release
    pipeline_file: release.yml
    auto_promote:
      when: "tag =~ '^(rust|python|dotnet)/v' AND (result = 'passed' OR result = 'failed')"
  - name: Ask agent
    pipeline_file: ask.yml
    parameters:
      env_vars:
        - name: USER_COMMAND
          required: true
          description: "Free-text instruction passed verbatim to a sandboxed
            claude. The agent's answer is posted as a PR comment with this
            text quoted. At status 1 the agent answers only; at 2/3/4 the
            agent may also produce git fixup commits which the orchestrator
            pushes."
