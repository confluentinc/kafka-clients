version: v1.0
name: Build Rust FFI library

# Builds the FFI library (libconfluent_kafka.{so,dylib} / confluent_kafka.dll)
# and cbindgen header (confluent_kafka.h) for each target platform, and pushes
# them to the workflow artifact store. Linux/macOS build via
# .semaphore/build-ffi-artifact.sh; Windows builds natively with MSVC.

agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-3

# Release build with fat LTO is slow; allow more than the default 1h.
execution_time_limit:
  hours: 2

global_job_config:
  prologue:
    commands:
      - checkout

blocks:
  - name: "Rust build: Linux x64"
    dependencies: []
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-amd64-3
      env_vars:
        - name: ARCH
          value: x64
        - name: MANYLINUX_IMAGE
          value: quay.io/pypa/manylinux_2_28_x86_64:2026.05.07-2
      jobs:
        - name: build
          commands:
            - sh .semaphore/build-ffi-artifact.sh "$MANYLINUX_IMAGE"
            - ls -l dist/libconfluent_kafka.so dist/confluent_kafka.h
            - artifact push workflow dist/libconfluent_kafka.so --destination rust-linux-${ARCH}/libconfluent_kafka.so --force
            - artifact push workflow dist/confluent_kafka.h --destination rust-linux-${ARCH}/confluent_kafka.h --force

  - name: "Rust build: Linux arm64"
    dependencies: []
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-arm64-1
      env_vars:
        - name: ARCH
          value: arm64
        - name: MANYLINUX_IMAGE
          value: quay.io/pypa/manylinux_2_28_aarch64:2026.05.07-2
      jobs:
        - name: build
          commands:
            - sh .semaphore/build-ffi-artifact.sh "$MANYLINUX_IMAGE"
            - ls -l dist/libconfluent_kafka.so dist/confluent_kafka.h
            - artifact push workflow dist/libconfluent_kafka.so --destination rust-linux-${ARCH}/libconfluent_kafka.so --force
            - artifact push workflow dist/confluent_kafka.h --destination rust-linux-${ARCH}/confluent_kafka.h --force

  - name: "Rust build: macOS x64"
    dependencies: []
    task:
      agent:
        machine:
          type: s1-macos-15-amd64-6
      env_vars:
        - name: ARCH
          value: x64
      jobs:
        - name: build
          commands:
            - sh .semaphore/build-ffi-artifact.sh
            - ls -l dist/libconfluent_kafka.dylib dist/confluent_kafka.h
            - artifact push workflow dist/libconfluent_kafka.dylib --destination rust-macos-${ARCH}/libconfluent_kafka.dylib --force
            - artifact push workflow dist/confluent_kafka.h --destination rust-macos-${ARCH}/confluent_kafka.h --force

  - name: "Rust build: macOS arm64"
    dependencies: []
    task:
      agent:
        machine:
          type: s1-macos-15-arm64-8
      env_vars:
        - name: ARCH
          value: arm64
      jobs:
        - name: build
          commands:
            - sh .semaphore/build-ffi-artifact.sh
            - ls -l dist/libconfluent_kafka.dylib dist/confluent_kafka.h
            - artifact push workflow dist/libconfluent_kafka.dylib --destination rust-macos-${ARCH}/libconfluent_kafka.dylib --force
            - artifact push workflow dist/confluent_kafka.h --destination rust-macos-${ARCH}/confluent_kafka.h --force

  - name: "Rust build: Windows x64"
    dependencies: []
    task:
      agent:
        machine:
          type: s1-prod-windows
      env_vars:
        - name: ARCH
          value: x64
      jobs:
        - name: build
          commands:
            - choco install -y --no-progress nasm cmake rust-ms
            - $env:PATH = "C:\Program Files\NASM;C:\Program Files\CMake\bin;$env:PATH"
            - $cargoBin = (Get-ChildItem "C:\Program Files\Rust*\bin\cargo.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
            - if (-not $cargoBin) { throw "cargo.exe not found after 'choco install rust-ms'" }
            - $env:PATH = "$cargoBin;$env:PATH"
            - cargo --version
            - rustc --version
            - cargo build --features ffi --release
            - New-Item -ItemType Directory -Force dist | Out-Null
            - Copy-Item target\release\confluent_kafka.dll dist\
            # rustc names the MSVC import library confluent_kafka.dll.lib; the extension links it as confluent_kafka.lib.
            - if (Test-Path target\release\confluent_kafka.dll.lib) { Copy-Item target\release\confluent_kafka.dll.lib dist\confluent_kafka.lib } else { Copy-Item target\release\confluent_kafka.lib dist\confluent_kafka.lib }
            - Copy-Item target\include\confluent_kafka.h dist\
            - Get-ChildItem dist
            - artifact push workflow dist\confluent_kafka.dll --destination rust-windows-${Env:ARCH}/confluent_kafka.dll --force
            - artifact push workflow dist\confluent_kafka.lib --destination rust-windows-${Env:ARCH}/confluent_kafka.lib --force
            - artifact push workflow dist\confluent_kafka.h --destination rust-windows-${Env:ARCH}/confluent_kafka.h --force

promotions:
  - name: Build Python wheels
    pipeline_file: python-wheels.yml
