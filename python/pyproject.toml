[build-system]
requires = ["setuptools>=62.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluent-kafka"
version = "4.4.0b1.dev1"
description = "Python bindings for the Confluent Kafka Rust client"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Confluent Inc."}
]

[project.urls]
Repository = "https://github.com/confluentinc/kafka-clients"

[project.optional-dependencies]
# No PyPI confluent-kafka here: it installs the same top-level package
# `confluent_kafka` as this project, and the two in one site-packages break each
# other. The perf benchmarks' librdkafka baseline has its own venv
# (test/performance/requirements-librdkafka.txt, `make init-venv-librdkafka`).
dev = [
    "psutil",
    "matplotlib",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "testcontainers>=4.0",
    # assert_type / Never for the typing tests on Python 3.10 (in `typing` from 3.11)
    "typing_extensions>=4.2",
]

[tool.setuptools]
# The ``confluent_kafka`` package, one module per Java package (CLAUDE.md,
# Python Binding Conventions, Modules), and nothing else. The gRPC
# integration-test servers next to it (``grpc_server``, ``grpc_server_async``,
# ``grpc_translate``, ``grpc_chaos``) are not installed: they need ``grpc`` and
# generated ``*_pb2`` modules the wheel does not ship, the Docker images copy
# them in, and their unit test imports them from this directory.
packages = [
    "confluent_kafka",
    "confluent_kafka.admin",
    "confluent_kafka.common",
    "confluent_kafka.common.acl",
    "confluent_kafka.common.config",
    "confluent_kafka.common.errors",
    "confluent_kafka.common.header",
    "confluent_kafka.common.metrics",
    "confluent_kafka.common.network",
    "confluent_kafka.common.protocol",
    "confluent_kafka.common.protocol.types",
    "confluent_kafka.common.quota",
    "confluent_kafka.common.record",
    "confluent_kafka.common.requests",
    "confluent_kafka.common.resource",
    "confluent_kafka.common.security",
    "confluent_kafka.common.security.auth",
    "confluent_kafka.common.security.token",
    "confluent_kafka.common.security.token.delegation",
    "confluent_kafka.common.serialization",
    "confluent_kafka.consumer",
    "confluent_kafka.producer",
]

[tool.setuptools.package-data]
# The generated error modules' .pyi stubs, and the PEP 561 marker: the package
# ships its annotations (CLAUDE.md, Python Binding Conventions, Tests and typing).
"*" = ["*.pyi", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
