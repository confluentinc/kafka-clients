[package]
name = "verifiable-clients"
version = "0.1.0"
edition = "2024"
publish = false

# Rust translations of Apache Kafka's client-facing system-test tools
# (`org.apache.kafka.tools.VerifiableProducer` / `VerifiableConsumer`) plus
# their out-of-crate dependency `org.apache.kafka.server.util.ThroughputThrottler`.
# Kept as a separate workspace crate so the client crate's dependency tree stays
# clean, mirroring Java's separate `tools` module (Milestone 14, PLAN §2/§5).

[lib]
name = "verifiable_clients"
path = "src/lib.rs"

[[bin]]
name = "verifiable_producer"
path = "src/bin/verifiable_producer.rs"

[dependencies]
confluent-kafka-rust = { path = "../.." }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
