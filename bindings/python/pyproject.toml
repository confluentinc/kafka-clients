[build-system]
requires = ["setuptools>=62.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluent-kafka4"
version = "4.3.0"
description = "Python bindings for the Confluent Kafka Rust client"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Confluent Inc."}
]

[project.optional-dependencies]
dev = [
    "confluent-kafka>=2.13.0",
    "psutil",
    "matplotlib",
    "pytest",
    "pytest-asyncio",
    "testcontainers>=4.0",
]

[tool.setuptools]
py-modules = ["producer", "consumer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
