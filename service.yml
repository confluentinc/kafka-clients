name: kafka-clients
lang: unknown
lang_version: unknown
git:
  enable: true
codeowners:
  enable: true
semaphore:
  enable: true
  pipeline_enable: false
  triggers:
    - branches
    - pull_requests
    - tags
  branches:
    - master
  tasks:
    - name: run-sweep
      branch: master
      pipeline_file: .semaphore/semaphore.yml
      description: Run the translation agent's sweep phase, which evaluates dependencies, generates plans, and implements them by pushing commits and updating PR bodies. This is the main pipeline that runs on every build for the configured main branch (pushes, not PRs). It conditionally no-ops if triggered on a PR build or a non-main branch.
      parameters:
        - name: SEMAPHORE_GIT_BRANCH_CHECKOUT
          required: false
          description: Override the SEMAPHORE_GIT_BRANCH value that the pipeline sees. Useful for testing the sweep phase on a PR build by forcing the branch condition to match. Ignored if not set.
    - name: seed-branch-commit
      branch: master
      pipeline_file: .semaphore/seed.yml
      description: Bootstrap the branch_commit cursor that the translation agent walks. Run once when starting a new (rust_branch, ak_branch) tracking pair, or when manually re-aligning after upstream changes. Idempotent -- a row already present for rust_branch with the same (ak_branch, ak_commit) pair is left unchanged.
      parameters:
        - name: AK_BRANCH
          required: true
          default_value: trunk
          description: Apache Kafka branch this seed maps from.
        - name: AK_COMMIT
          required: true
          description: Apache Kafka commit SHA (full 40 chars) the seed maps to. The first sweep will walk the next 10 AK commits starting after this one.
        - name: RUST_BRANCH
          required: true
          default_value: master
          description: Rust client branch this seed maps to.
        - name: FORCE
          required: true
          default_value: 'False'
          description: Allow overwriting the existing branch_commit cursor for the given RUST_BRANCH. Without this, the task errors out if a row already exists with a different ak_branch/ak_commit pair. Use to re-align after upstream changes or after an interrupted run.
          options:
            - 'False'
            - 'True'
        - name: CLEANUP_PRS
          required: true
          default_value: 'False'
          description: Delete every pr_commit row for RUST_BRANCH before seeding. Use to reset a branch's PR queue when stale/failed rows would otherwise be picked up by the next sweep.
          options:
            - 'False'
            - 'True'
    - name: delete-prs
      branch: master
      pipeline_file: .semaphore/delete-prs.yml
      description: Delete pr_commit rows and GitHub head branches for an explicit list of PR numbers, scoped to a single rust_branch. Use to drop stale/failed/cancelled PRs without resetting the entire rust_branch queue. PRs whose stored rust_branch does not match RUST_BRANCH are rejected with a hard error and no changes made.
      parameters:
        - name: RUST_BRANCH
          required: true
          description: 'Safety scope: only PRs whose stored rust_branch matches are processed; a mismatch is a hard error with no changes made.'
        - name: PR_NUMBERS
          required: true
          description: Comma-separated PR numbers, no spaces (e.g. "123,456,789").
        - name: DRY_RUN
          required: true
          default_value: 'True'
          description: '"True" prints what would be deleted without making any changes; "False" executes the deletion.'
          options:
            - 'True'
            - 'False'
    - name: bump-version
      branch: master
      pipeline_file: .semaphore/bump-version.yml
      description: Set a new version with `make bump-version` on a branch off BASE_BRANCH and open a PR with it. The Cargo manifests and Cargo.lock get VERSION as given, the Python packages its PEP 440 form (0.3.0-rc.1 -> 0.3.0rc1) unless PYTHON_VERSION is set. Nothing is merged, tagged or published; the PR's build runs the checks. Fails if the branch bump-version/<VERSION> already exists on origin.
      parameters:
        - name: VERSION
          required: true
          description: The new version, X.Y.Z or X.Y.Z-alpha.N, X.Y.Z-beta.N, X.Y.Z-dev.N, X.Y.Z-rc.N (e.g. "0.3.0-rc.1"). It must not be below the current one.
        - name: PYTHON_VERSION
          required: false
          description: A PEP 440 version in normal form for the Python packages instead of VERSION's, e.g. "0.3.0.post1" for a Python-only release. Ignored if not set.
        - name: BASE_BRANCH
          required: true
          default_value: master
          description: The branch to bump and the PR's base.
